<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>對開表排版</title>
<style>
:root{--fs:1;--lh:1.15;--zoom:1;--k:1}
*{box-sizing:border-box}
body{margin:0;background:#8a8a8a;font-family:'PingFang TC',sans-serif}

/* ---- 拖曳載入區 ---- */
#drop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;background:#2b2b2b;color:#eee;z-index:20;text-align:center;padding:24px}
#drop.hide{display:none}
#zone{border:3px dashed #777;border-radius:14px;padding:56px 72px;transition:.15s;cursor:pointer;max-width:640px}
#zone.on{border-color:#6cf;background:#33414d}
#zone h1{margin:0 0 10px;font-size:21px;font-weight:600}
#zone p{margin:6px 0;font-size:13px;color:#bbb;line-height:1.7}
#zone b{color:#eee}
#err{color:#ff8a8a;font-size:13px;white-space:pre-wrap;min-height:18px}
#drop small{color:#888;font-size:12px;max-width:620px;line-height:1.8}

#bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
     padding:8px 14px;background:#222;color:#eee;font-size:13px}
#bar.hide{display:none}
#bar b{font-weight:600}
#bar label{display:flex;gap:5px;align-items:center;white-space:nowrap}
#bar input[type=range]{width:96px}
#bar input[type=number]{width:64px;padding:2px 4px}
#bar button{padding:4px 9px;background:#444;color:#eee;border:1px solid #666;border-radius:4px;cursor:pointer}
#bar button:hover{background:#555}
#hint{opacity:.6;font-size:12px}

#doc{padding:20px;transform-origin:top left;transform:scale(var(--zoom));width:max-content}
.spread{position:relative;display:flex;gap:12px;margin-bottom:18px;padding-left:58px}
.gut{position:absolute;left:0;top:0;width:54px;font-size:10px;color:#ddd;text-align:right}
.glab{position:absolute;right:4px;transform:translateY(-100%);cursor:pointer;white-space:nowrap}
.glab:hover{color:#fff;text-decoration:underline}
.glab.full{color:#ffd24a;font-weight:700}
.glab.brk{color:#7bf}
.page{position:relative;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);flex:none;overflow:hidden}
.tline{display:flex;align-items:flex-end;overflow:hidden}
.tline>span{flex:1;line-height:var(--lh)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td,th{padding:0;vertical-align:top;font-weight:400}
.cw{overflow:hidden;line-height:var(--lh);padding:0 3px}
.vc{display:flex;flex-direction:column;justify-content:center}
.vb{display:flex;flex-direction:column;justify-content:flex-end}
tr.sel>td{background:#fff6cc}
.over{box-shadow:inset 0 -2px 0 #e00}
.pno{position:absolute;bottom:5mm;left:0;right:0;text-align:center;font-size:9pt;color:#333}
.badge{position:absolute;top:3px;right:5px;font-size:11px;color:#060;background:#eee;padding:1px 5px;border-radius:3px}
.badge.bad{color:#fff;background:#d00}
.mark{position:absolute;top:3px;left:5px;font-size:11px;color:#fff;background:#36c;padding:1px 6px;border-radius:3px;cursor:pointer}
.mark:hover{background:#d00}
@media print{
  body{background:#fff}
  #bar,#drop,.badge,.mark{display:none}
  #doc{padding:0;transform:none;width:auto}
  .spread{display:block;margin:0;padding-left:0}
  .gut{display:none}
  .page{box-shadow:none;break-after:page}
  .spread:last-child .page:last-child{break-after:auto}
  tr.sel>td{background:none}
  .over{box-shadow:none}
}
</style>
<style id="dyn"></style>
</head>
<body>

<div id="drop">
  <div id="zone">
    <h1>把 .xlsx 拖進來</h1>
    <p>或<b>點這裡選檔案</b></p>
    <p>版面（左右頁分欄、分頁、重複表頭、紙張邊界、列高欄寬字型框線）<br>全部從檔案的列印設定讀出來</p>
  </div>
  <div id="err"></div>
  <small>只吃 .xlsx。舊的 .xls 請先在 Excel 裡「另存新檔 → Excel 活頁簿 (.xlsx)」，
  或用 <b>xls2spread.py</b> 轉。<br>檔案不會上傳，全部在你這台電腦的瀏覽器裡處理。</small>
  <input type="file" id="file" accept=".xlsx" hidden>
</div>

<div id="bar" class="hide">
  <b id="fname"></b>
  <label>縮放<input type="range" id="k" min="0.5" max="1.2" step="0.005"><span id="kv"></span></label>
  <label>行距<input type="range" id="lh" min="0.9" max="2" step="0.05"><span id="lhv"></span></label>
  <label>字級<input type="range" id="fs" min="0.7" max="1.4" step="0.01"><span id="fsv"></span></label>
  <label>天地線高<input type="number" id="sh" step="0.5">mm</label>
  <label title="末頁表格含合計與備註的總高；勾選＝跟著天地線高走，備註底部自動對齊其他頁的地線">
    <input type="checkbox" id="linkend">末頁備註底對齊地線
    <input type="number" id="shend" step="0.5">mm</label>
  <label>檢視<input type="range" id="zm" min="0.3" max="1.5" step="0.05"></label>
  <label>本列高<input type="number" id="rh" step="0.5" disabled>pt</label>
  <button id="bfit">選取列配高</button>
  <button id="bfitall">全部配高</button>
  <button id="bhtml">HTML 重排</button>
  <button id="beven" title="把該頁剩下的空白平均加到每一列，看起來不會上密下空">本頁均分</button>
  <button id="bevenall">各頁均分</button>
  <button id="bbrk">此列前分頁 (B)</button>
  <button id="bauto">清掉全部手動分頁</button>
  <label><input type="checkbox" id="push">依列高自動分頁（前後流動）</label>
  <button id="bsave">匯出設定</button>
  <button id="bload">匯入設定</button>
  <button id="breset">重設</button>
  <button id="bnew">換檔案</button>
  <button id="bprint">列印 / 存 PDF</button>
  <span id="hint">單列調高：拖該列下緣，或點選後用 ↑↓ (Shift×5)／直接填「本列高」｜雙擊＝該列自動配高｜左右頁同一列永遠同高</span>
</div>

<div id="doc"></div>

<script>
/* ============================ 讀 xlsx ============================ */
/* ponytail: 用瀏覽器內建的 DecompressionStream 解 zip、DOMParser 解 XML，不帶任何函式庫。
   只處理一般 xlsx（非 zip64、非加密）；真的遇到再換 SheetJS。 */

async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eo = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if (eo < 0) throw new Error('這不是有效的 xlsx（找不到 zip 結構）');
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const files = {};
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip 目錄壞掉');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el_ = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method, csize, lho: dv.getUint32(p + 42, true)};
    p += 46 + nl + el_ + cl;
  }
  return {u8, dv, files};
}

async function entry(z, name){
  const f = z.files[name];
  if (!f) return null;
  const nl = z.dv.getUint16(f.lho + 26, true), el_ = z.dv.getUint16(f.lho + 28, true);
  const start = f.lho + 30 + nl + el_;
  const bytes = z.u8.subarray(start, start + f.csize);
  if (f.method === 0) return new TextDecoder().decode(bytes);
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(s).text();
}

const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const colNum = ref => { let n = 0; for (const c of ref){ const v = c.charCodeAt(0); if (v < 65) break; n = n*26 + (v-64); } return n; };
const rowNum = ref => +ref.match(/\d+/)[0];
const colName = n => { let s = ''; while (n > 0){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = (n-1-m)/26; } return s; };

const BUILTIN_FMT = {0:'General',1:'0',2:'0.00',3:'#,##0',4:'#,##0.00',9:'0%',10:'0.00%',
  37:'#,##0_);(#,##0)',38:'#,##0_);[Red](#,##0)',39:'#,##0.00_);(#,##0.00)',40:'#,##0.00_);[Red](#,##0.00)',49:'@'};

function fmtNum(v, nf){
  const secs = (nf || '').split(';');
  if (v === 0 && secs.length >= 3 && secs[2].includes('-')) return '-';
  if (!nf || nf === 'General' || nf === '@') return String(Math.round(v * 1e10) / 1e10);
  const dec = nf.includes('0.00') ? 2 : 0;
  return nf.includes('#,##0')
    ? v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec})
    : v.toFixed(dec);
}

const BW = {hair:.25, thin:.5, medium:1, thick:1.5, double:1, dashed:.5, dotted:.5, mediumDashed:1};
const FONT_STACK = {
  '微軟正黑體': "'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC',sans-serif",
  '新細明體': "'PMingLiU','Songti TC','Noto Serif CJK TC',serif",
  '細明體': "'MingLiU','Songti TC',serif",
  '華康中明體': "'DFKai-SB','Songti TC',serif",
  '華康中黑體': "'PingFang TC','Microsoft JhengHei',sans-serif",
  'Times New Roman': "'Times New Roman',Times,serif"
};
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Excel 寫 1/0，LibreOffice 寫 true/false，兩種都要認
const isOn = v => v != null && v !== '0' && v !== 'false';
const flagOf = e => !!e && isOn(e.getAttribute('val') ?? '1');
const rgbOf = el_ => {
  const c = el_ && el_.getAttribute('rgb');
  if (!c) return null;
  const h = c.slice(-6);
  return h === '000000' ? null : '#' + h;
};

async function parseXlsx(buf, fileName){
  const z = await unzip(buf);
  const wb = xml(await entry(z, 'xl/workbook.xml'));
  const rels = xml(await entry(z, 'xl/_rels/workbook.xml.rels'));
  const relMap = {};
  rels.querySelectorAll('Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));

  const sheets = [...wb.querySelectorAll('sheets > sheet')].map((s,i) => ({
    name: s.getAttribute('name'), idx: i,
    path: 'xl/' + (relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')] || '')
                    .replace(/^\/?xl\//, '')
  }));

  const defName = (nm, idx) => {
    const d = [...wb.querySelectorAll('definedNames > definedName')]
      .find(d => d.getAttribute('name') === nm && +d.getAttribute('localSheetId') === idx);
    return d ? d.textContent : null;
  };

  // 挑有列印範圍的工作表；沒有就挑資料最多的
  let pick = sheets.find(s => defName('_xlnm.Print_Area', s.idx));
  if (!pick){
    let best = -1;
    for (const s of sheets){
      const t = await entry(z, s.path);
      if (t && t.length > best){ best = t.length; pick = s; }
    }
  }
  if (!pick) throw new Error('找不到工作表');

  const sh = xml(await entry(z, pick.path));
  const st = xml(await entry(z, 'xl/styles.xml'));
  const ssTxt = await entry(z, 'xl/sharedStrings.xml');

  // --- 樣式 ---
  const numFmt = {...BUILTIN_FMT};
  st.querySelectorAll('numFmts > numFmt').forEach(f => numFmt[+f.getAttribute('numFmtId')] = f.getAttribute('formatCode'));
  const fonts = [...st.querySelectorAll('fonts > font')].map(f => ({
    name: (f.querySelector('name') || f.querySelector('rFont') || {getAttribute:()=>null}).getAttribute('val'),
    sz: +((f.querySelector('sz') || {getAttribute:()=>11}).getAttribute('val') || 11),
    b: flagOf(f.querySelector('b')),
    color: rgbOf(f.querySelector('color'))
  }));
  const borders = [...st.querySelectorAll('borders > border')].map(b => {
    const g = t => { const e = b.querySelector(t); return e ? e.getAttribute('style') : null; };
    return {left: g('left'), right: g('right'), top: g('top'), bottom: g('bottom')};
  });
  const xfs = [...st.querySelectorAll('cellXfs > xf')].map(x => {
    const a = x.querySelector('alignment');
    return {
      numFmtId: +(x.getAttribute('numFmtId') || 0),
      fontId: +(x.getAttribute('fontId') || 0),
      borderId: +(x.getAttribute('borderId') || 0),
      h: a && a.getAttribute('horizontal'), v: a && a.getAttribute('vertical'),
      wrap: !!(a && isOn(a.getAttribute('wrapText'))),
      indent: +((a && a.getAttribute('indent')) || 0)
    };
  });

  // --- 共用字串（保留 rich text 的顏色，白字是原檔用來縮排的） ---
  const shared = ssTxt ? [...xml(ssTxt).querySelectorAll('sst > si')].map(si => {
    const rs = [...si.querySelectorAll(':scope > r')];
    if (!rs.length){ const t = si.querySelector('t'); return [{t: t ? t.textContent : '', c: null}]; }
    return rs.map(r => ({t: (r.querySelector('t') || {textContent:''}).textContent,
                         c: rgbOf(r.querySelector('rPr > color'))}));
  }) : [];

  // --- 儲存格 ---
  const cells = {}, rowH = {};
  sh.querySelectorAll('sheetData > row').forEach(r => {
    const ri = +r.getAttribute('r');
    const ht = r.getAttribute('ht');
    if (ht) rowH[ri] = +ht;
    r.querySelectorAll('c').forEach(c => {
      const ref = c.getAttribute('r');
      const vEl = c.querySelector('v'), isEl = c.querySelector('is');
      cells[ref] = {s: +(c.getAttribute('s') || 0), t: c.getAttribute('t'),
                    v: vEl ? vEl.textContent : null,
                    is: isEl ? [...isEl.querySelectorAll('r')].map(r2 => ({t:(r2.querySelector('t')||{textContent:''}).textContent, c: rgbOf(r2.querySelector('rPr > color'))}))
                              .concat(isEl.querySelector(':scope > t') ? [{t: isEl.querySelector(':scope > t').textContent, c: null}] : []) : null};
    });
  });

  const defRowH = +((sh.querySelector('sheetFormatPr') || {getAttribute:()=>null}).getAttribute('defaultRowHeight') || 16.5);
  const colW = {};
  sh.querySelectorAll('cols > col').forEach(c => {
    const w = +c.getAttribute('width');
    for (let i = +c.getAttribute('min'); i <= +c.getAttribute('max'); i++) colW[i] = w;
  });

  const merges = {};
  const skip = new Set();
  sh.querySelectorAll('mergeCells > mergeCell').forEach(m => {
    const [a, b] = m.getAttribute('ref').split(':');
    const c1 = colNum(a), r1 = rowNum(a), c2 = colNum(b), r2 = rowNum(b);
    merges[r1 + ',' + c1] = [r2 - r1 + 1, c2 - c1 + 1];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r !== r1 || c !== c1) skip.add(r + ',' + c);
  });

  const pm = sh.querySelector('pageMargins') || {getAttribute: () => null};
  const ps = sh.querySelector('pageSetup') || {getAttribute: () => null};
  const num = (v, d) => v == null ? d : +v;

  return buildModel({
    fileName, sheetName: pick.name,
    printArea: defName('_xlnm.Print_Area', pick.idx),
    printTitles: defName('_xlnm.Print_Titles', pick.idx),
    colBreaks: [...sh.querySelectorAll('colBreaks > brk')].map(b => +b.getAttribute('id')),
    rowBreaks: [...sh.querySelectorAll('rowBreaks > brk')].map(b => +b.getAttribute('id')),
    landscape: ps.getAttribute('orientation') === 'landscape',
    fitToPage: isOn((sh.querySelector('sheetPr > pageSetUpPr') || {getAttribute:()=>null}).getAttribute('fitToPage')),
    scale: +(ps.getAttribute('scale') || 100),
    margins: {l: num(pm.getAttribute('left'), .75), r: num(pm.getAttribute('right'), .75),
              t: num(pm.getAttribute('top'), 1), b: num(pm.getAttribute('bottom'), 1)},
    cells, rowH, defRowH, colW, merges, skip, shared, xfs, fonts, borders, numFmt
  });
}

/* ============================ 組版面模型 ============================ */

function buildModel(x){
  const A1 = s => { const m = s.replace(/\$/g,'').split('!').pop().split(':');
                    return [colNum(m[0]), rowNum(m[0]), colNum(m[1]), rowNum(m[1])]; };
  let c1 = 1, r1 = 1, c2 = 1, r2 = 1;
  if (x.printArea) [c1, r1, c2, r2] = A1(x.printArea);
  else {
    for (const ref in x.cells){ c2 = Math.max(c2, colNum(ref)); r2 = Math.max(r2, rowNum(ref)); }
  }
  const split = x.colBreaks.length ? x.colBreaks[0] : c2;
  const halves = {l: [], r: []};
  for (let c = c1; c <= c2; c++) (c <= split ? halves.l : halves.r).push(c);
  if (!halves.r.length){ halves.r = halves.l.splice(Math.ceil(halves.l.length/2)); }

  const hdrLast = x.printTitles ? +x.printTitles.replace(/\$/g,'').split('!').pop().split(':')[1] : r1 - 1;
  const hdrRows = []; for (let r = r1; r <= hdrLast; r++) hdrRows.push(r);
  const dataRows = []; for (let r = hdrLast + 1; r <= r2; r++) dataRows.push(r);

  const xfOf = ref => x.xfs[(x.cells[ref] || {s:0}).s] || x.xfs[0] || {};
  const bdOf = ref => x.borders[xfOf(ref).borderId] || {};

  // CSS class 收斂
  const cssMap = new Map(), css = [];
  function cls(ref, nohz){
    const xf = xfOf(ref), f = x.fonts[xf.fontId] || {}, b = bdOf(ref);
    const sig = [f.name, f.sz, !!f.b, f.color, xf.h, xf.v, xf.wrap, xf.indent,
                 b.left, b.right, nohz ? null : b.top, nohz ? null : b.bottom].join('|');
    if (cssMap.has(sig)) return cssMap.get(sig);
    const nm = 'c' + cssMap.size;
    cssMap.set(sig, nm);
    const d = [`font-family:${FONT_STACK[f.name] || 'sans-serif'}`,
               `font-size:calc(${f.sz || 11}pt * var(--fs) * var(--k))`];
    if (f.b) d.push('font-weight:700');
    if (f.color) d.push(`color:${f.color}`);
    d.push(xf.h === 'distributed' ? 'text-align:justify;text-align-last:justify' : `text-align:${xf.h || 'left'}`);
    if (xf.indent) d.push(`padding-left:calc(${xf.indent * .5}em + 2px)`);
    d.push('white-space:' + (xf.wrap ? 'pre-wrap' : 'pre'));
    [['left',b.left],['right',b.right],['top',nohz?null:b.top],['bottom',nohz?null:b.bottom]]
      .forEach(([s,v]) => { if (v) d.push(`border-${s}:${BW[v] || .5}pt solid #000`); });
    css.push(`.${nm}{${d.join(';')}}`);
    return nm;
  }

  const VAL = {center:'vc', bottom:'vb'};
  function cell(r, c, nohz){
    if (x.skip.has(r + ',' + c)) return null;
    const ref = colName(c) + r, cv = x.cells[ref];
    const xf = xfOf(ref);
    let t = '';
    if (cv && cv.v != null){
      if (cv.t === 's'){
        t = (x.shared[+cv.v] || []).map(run => run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t)).join('');
        // 白字是「換行後的縮排」，補上換行，換行點才不會隨字型跑掉
        const runs = x.shared[+cv.v] || [];
        let plain = '', out = '';
        runs.forEach(run => {
          if (/^#f{2}f{2}f{2}$/i.test(run.c || '') && plain && !plain.endsWith('\n')){ out += '\n'; plain += '\n'; }
          out += run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t);
          plain += run.t;
        });
        t = out;
      } else if (cv.t === 'str' || cv.t === 'e'){ t = esc(cv.v); }
      else if (cv.t === 'b'){ t = cv.v === '1' ? 'TRUE' : 'FALSE'; }
      else { t = esc(fmtNum(+cv.v, x.numFmt[xf.numFmtId])); }
    } else if (cv && cv.is){
      t = cv.is.map(run => run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t)).join('');
    }
    const m = x.merges[r + ',' + c] || [1,1];
    const o = {t, c: cls(ref, nohz)};
    if (VAL[xf.v]) o.v = VAL[xf.v];
    if (m[0] > 1) o.rs = m[0];
    if (m[1] > 1) o.cs = m[1];
    return o;
  }

  const rowh = r => Math.round((x.rowH[r] || x.defRowH) * 100) / 100;
  const pack = (rows, nohz) => rows.map(r => ({
    h: rowh(r),
    l: halves.l.map(c => cell(r, c, nohz)).filter(Boolean),
    r: halves.r.map(c => cell(r, c, nohz)).filter(Boolean)
  }));

  const allc = halves.l.concat(halves.r);
  // 有垂直框線才算表格本體；只有底線（天線）的仍屬標題區
  const framed = r => allc.some(c => { const b = bdOf(colName(c) + r); return b.left || b.right; });
  const titleRows = hdrRows.filter(r => !framed(r));
  const headRows = hdrRows.filter(r => framed(r));

  // 合計列（下框線是粗線）與其後的附註列 -> 釘在天地線位置
  const pinned = dataRows.filter(r => allc.some(c => bdOf(colName(c) + r).bottom === 'medium'));
  const footFrom = pinned.length ? pinned[pinned.length-1] : r2 + 1;
  const bodyRows = dataRows.filter(r => r < footFrom);
  const footRows = dataRows.filter(r => r >= footFrom);

  const widths = side => {
    const w = halves[side].map(c => x.colW[c] || 8.43), t = w.reduce((a,b) => a+b, 0);
    return w.map(v => Math.round(v / t * 1e6) / 1e4);
  };

  // rowBreaks 的 id 是「這一列之後分頁」，下一頁從 id+1 開始
  const breaks = x.rowBreaks.map(r => bodyRows.indexOf(r) + 1)
                            .filter(i => i > 0 && i < bodyRows.length).sort((a,b) => a-b);

  // Excel fitToPage 的縮放率沒存在檔裡。它是照「欄寬」縮的：把較寬的那半頁縮到版心寬度。
  // 欄寬單位是字元數，換算像素要乘 MDW（預設字型的數字寬度），每欄再加 5px 邊距。
  const ph = x.landscape ? 210 : 297, pw = x.landscape ? 297 : 210;
  const mdw = Math.max(1, Math.round((x.fonts[0] && x.fonts[0].sz || 11) * 96 / 72 * .5));
  const printablePx = (pw - (x.margins.l + x.margins.r) * 25.4) / 25.4 * 96;
  const naturalPx = Math.max(...['l','r'].map(s =>
    halves[s].reduce((a,c) => a + (x.colW[c] || 8.43), 0) * mdw + 5 * halves[s].length));
  const k = x.fitToPage ? Math.min(1, Math.round(printablePx / naturalPx * 1e4) / 1e4)
                        : (x.scale || 100) / 100;

  return {
    name: x.fileName, sheet: x.sheetName, k,
    page: {w: pw, h: ph, ml: +(x.margins.l * 25.4).toFixed(2), mr: +(x.margins.r * 25.4).toFixed(2),
           mt: +(x.margins.t * 25.4).toFixed(2), mb: +(x.margins.b * 25.4).toFixed(2)},
    cols: {l: widths('l'), r: widths('r')},
    title: pack(titleRows), head: pack(headRows),
    rows: pack(bodyRows, true), foot: pack(footRows),
    breaks, css
  };
}

/* ============================ 載入流程 ============================ */
const $ = id => document.getElementById(id);
const el = (t,c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

const zone = $('zone');
zone.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); if ($('drop').classList.contains('hide')) return; zone.classList.add('on');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('on'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
$('bnew').onclick = () => { $('drop').classList.remove('hide'); $('bar').classList.add('hide'); $('doc').innerHTML = ''; };

async function load(file){
  $('err').textContent = '';
  if (/\.xls$/i.test(file.name)){
    $('err').textContent = '這是舊版 .xls，瀏覽器讀不了。\n請在 Excel 另存為 .xlsx，或用 xls2spread.py 轉。';
    return;
  }
  try {
    zone.querySelector('h1').textContent = '讀取中…';
    const model = await parseXlsx(await file.arrayBuffer(), file.name);
    start(model);
  } catch (e){
    $('err').textContent = '讀取失敗：' + e.message;
    console.error(e);
  } finally {
    zone.querySelector('h1').textContent = '把 .xlsx 拖進來';
  }
}

/* ============================ 編輯器 ============================ */
let D, S, dflt, titlePt, headPt, footPt, sel = -1;
const MM = 96/25.4, PT = 96/72;
let KEY = '', store = {get: () => ({}), set: () => {}};

function start(model){
  D = model;
  if (!D.rows.length) throw new Error('列印範圍內沒有資料列');
  KEY = 'spread:' + D.name + ':' + D.sheet;
  store = {
    get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
    set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
  };
  titlePt = D.title.reduce((s,r) => s + r.h, 0);
  headPt  = D.head.reduce((s,r) => s + r.h, 0);
  footPt  = D.foot.reduce((s,r) => s + r.h, 0);
  const shDflt = +((D.page.h - D.page.mt - D.page.mb) - titlePt * D.k / 72 * 25.4).toFixed(1);
  dflt = {h: D.rows.map(r => r.h), breaks: D.breaks.slice(),
          lh: 1.15, fs: 1, zoom: .5, k: D.k, push: true, sh: shDflt, shend: shDflt, linkEnd: true};
  const saved = store.get();
  S = Object.assign({}, dflt, saved);
  // Object.assign 只複製陣列參照，不切一份的話改列高會把 dflt 一起改掉，「重設」就救不回來
  S.h = S.h.slice(); S.breaks = S.breaks.slice();
  if (S.h.length !== D.rows.length){ S.h = dflt.h.slice(); S.breaks = dflt.breaks.slice(); }
  sel = -1;
  var firstTime = !Object.keys(saved).length;

  $('dyn').textContent = D.css.join('\n')
    + `\n@media print{@page{size:${D.page.w}mm ${D.page.h}mm;margin:0}`
    + `.page{height:calc(${D.page.h}mm - 0.2mm)!important}}`;
  $('fname').textContent = D.name + ' / ' + D.sheet;
  $('drop').classList.add('hide');
  $('bar').classList.remove('hide');
  bind(); render();
  // Excel 的列高被儲存格網格撐大、分頁也是遷就格線切的；HTML 沒這限制。
  // 第一次載入就照內容重排（要 Excel 原樣按「重設」）。
  if (firstTime) htmlLayout();
}

// 把一頁剩下的空白平均分給該頁每一列，讓行距看起來一致，不會上面擠、下面一大塊空白。
// 無條件捨去到 0.1pt，確保加完的總高不會反而超過容量、害最後一列被擠到下一頁。
function evenOut(all){
  const pg = pages();
  const targets = all ? pg.map((idx,n) => [idx, n === pg.length-1])
                      : pg.map((idx,n) => [idx, n === pg.length-1]).filter(([idx]) => idx.includes(sel));
  if (!targets.length){ alert('先點選要調整的那一頁裡的任一列'); return; }
  targets.forEach(([idx, last]) => {
    const add = (capOf(last) - idx.reduce((s,i) => s + S.h[i], 0)) / idx.length;
    if (add > 0) idx.forEach(i => S.h[i] = Math.floor((S.h[i] + add) * 10) / 10);
  });
  render();
}

function htmlLayout(){
  D.rows.forEach((_,i) => fit(i));   // 每列壓到左右頁文字實際需要的高度
  S.breaks = [];                     // 分頁交給高度決定，不沿用原檔的
  render();
}

// 末頁的表格總高含合計＋備註。跟著 sh 走時，備註底部就會落在其他頁地線的同一條線上，
// 末頁的地線（合計下框線）自動被備註的高度往上頂。
const endH = () => S.linkEnd ? S.sh : S.shend;
// 減 2pt：分頁是照列高數字算的，實際渲染還會多出框線厚度，不留餘裕會有頁面剛好擠爆、
// 填空列被壓成 0，那一頁的地線就會比別頁低個 0.3mm
const capOf = last => (((last ? endH() : S.sh) * 72 / 25.4) - 2) / S.k - headPt - (last ? footPt : 0);
const mmOf = h => h * S.k / 72 * 25.4;

function cellEl(tag, c, h){
  const td = el(tag);
  if (c.cs) td.colSpan = c.cs;
  if (c.rs) td.rowSpan = c.rs;
  const w = el('div', 'cw ' + c.c + (c.v ? ' ' + c.v : ''));
  if (h != null) w.style.height = (h * S.k).toFixed(2) + 'pt';
  w.innerHTML = c.t;
  td.appendChild(w);
  return td;
}

function pages(){
  const hard = new Set(S.breaks), cap = capOf(false);
  const out = []; let cur = [], acc = 0;
  D.rows.forEach((r,i) => {
    const h = S.h[i];
    if (cur.length && (hard.has(i) || (S.push && acc + h > cap))){ out.push(cur); cur = []; acc = 0; }
    cur.push(i); acc += h;
  });
  if (cur.length) out.push(cur);
  for (let g = 0; S.push && g < 50; g++){
    const lp = out[out.length-1], cl = capOf(true), moved = [];
    while (lp.length > 1 && lp.reduce((s,i) => s + S.h[i], 0) > cl) moved.unshift(lp.pop());
    if (!moved.length) break;
    out.push(moved);
  }
  return out.length ? out : [[]];
}

function makePage(idx, side, no, last, first){
  const g = D.page, p = el('div','page');
  p.style.width = g.w + 'mm'; p.style.height = g.h + 'mm';
  p.style.padding = `${g.mt}mm ${g.mr}mm ${g.mb}mm ${g.ml}mm`;

  D.title.forEach(r => {
    const line = el('div','tline'); line.style.height = (r.h * S.k).toFixed(2) + 'pt';
    r[side].forEach(c => {
      const s = el('span', c.c);
      // 標題列每頁重複，（續）會出現在每一頁；第一組對開不該有
      s.innerHTML = first ? c.t.replace(/（續）\s*$/, '') : c.t;
      line.appendChild(s);
    });
    p.appendChild(line);
  });

  const tb = el('table'), cg = el('colgroup');
  D.cols[side].forEach(w => { const co = el('col'); co.style.width = w + '%'; cg.appendChild(co); });
  tb.appendChild(cg);

  const head = el('thead');
  D.head.forEach((r,k) => {
    const tr = el('tr');
    r[side].forEach(c => {
      const span = c.rs || 1;
      tr.appendChild(cellEl('th', c, D.head.slice(k, k + span).reduce((s,x) => s + x.h, 0)));
    });
    head.appendChild(tr);
  });
  tb.appendChild(head);

  const body = el('tbody');
  idx.forEach(i => {
    const tr = el('tr'); tr.dataset.i = i;
    if (i === sel) tr.className = 'sel';
    D.rows[i][side].forEach(c => tr.appendChild(cellEl('td', c, S.h[i])));
    body.appendChild(tr);
  });

  const fill = el('tr');
  ((D.rows[idx[0]] || D.rows[0])[side]).forEach(c => {
    const t = el('td'); t.className = c.c;
    if (!last) t.style.borderBottom = '1pt solid #000';
    fill.appendChild(t);
  });
  fill.style.height = '0';
  body.appendChild(fill);

  if (last) D.foot.forEach(r => {
    const tr = el('tr');
    r[side].forEach(c => tr.appendChild(cellEl('td', c, r.h)));
    body.appendChild(tr);
  });

  tb.appendChild(body);
  p.appendChild(tb);
  const pn = el('div','pno'); pn.textContent = no; p.appendChild(pn);
  p._fill = fill; p._tb = tb;
  return p;
}

function render(){
  const doc = $('doc'); doc.innerHTML = '';
  const pg = pages();
  pg.forEach((idx,n) => {
    const sp = el('div','spread'), last = n === pg.length - 1;
    const L = makePage(idx,'l',n*2+1,last,n===0), R = makePage(idx,'r',n*2+2,last,n===0);
    sp.append(L,R); doc.appendChild(sp);
    const target = (last ? endH() : S.sh) * MM;
    // offsetHeight 是整數像素，會讓各頁地線差個 0.2mm；用 rect 的浮點高度（要除掉檢視縮放）
    const th = p => p._tb.getBoundingClientRect().height / S.zoom;
    const slack = Math.min(target - th(L), target - th(R));
    [L,R].forEach(p => p._fill.style.height = Math.max(0, slack) + 'px');
    // capOf(true) 已經扣掉合計＋附註，這裡只算資料列，不然會重複計
    const used = idx.reduce((s,i) => s + S.h[i], 0), cap = capOf(last);
    [L,R].forEach(p => {
      const b = el('div','badge');
      b.textContent = `累積 ${mmOf(used).toFixed(1)} / ${mmOf(cap).toFixed(1)}mm`
        + (used > cap ? ` ・超出 ${mmOf(used-cap).toFixed(1)}mm` : ` ・剩 ${mmOf(cap-used).toFixed(1)}mm`);
      if (used > cap) b.className = 'badge bad';
      p.appendChild(b);
    });
    guides(sp, L, idx, last);
    if (S.breaks.includes(idx[0])){
      const m = el('div','mark');
      m.textContent = '⛔ 手動分頁（點掉讓資料往前流）';
      m.onclick = () => { S.breaks = S.breaks.filter(v => v !== idx[0]); render(); };
      L.appendChild(m);
    }
  });
  document.querySelectorAll('.cw').forEach(w => {
    if (w.scrollHeight <= w.clientHeight + 1) return;
    // 比一行還矮的列是原檔刻意留的間隔列，不算被切掉
    if (w.clientHeight < parseFloat(getComputedStyle(w).lineHeight)) return;
    w.classList.add('over');
  });
  if (sel >= 0) $('rh').value = S.h[sel];
  store.set(S);
}

// 左側標尺：每列標出本頁資料列到這裡的累積高度，點一下 = 在這一列之後停
function guides(sp, L, idx, last){
  const g = el('div','gut'), cap = capOf(last);
  let acc = 0;
  [...L.querySelectorAll('tr[data-i]')].forEach((tr,n) => {
    const i = +tr.dataset.i;
    acc += S.h[i];
    if (tr.offsetHeight < 16 && n !== idx.length - 1) return;
    const lab = el('div','glab');
    lab.style.top = (tr.offsetTop + tr.offsetHeight) + 'px';
    lab.textContent = mmOf(acc).toFixed(0) + (n === idx.length - 1 ? ' ▏滿' : '');
    if (n === idx.length - 1) lab.classList.add('full');
    if (S.breaks.includes(i + 1)) lab.classList.add('brk');
    lab.title = `本頁資料列累積 ${mmOf(acc).toFixed(1)}mm / 可放 ${mmOf(cap).toFixed(1)}mm（剩 ${mmOf(cap-acc).toFixed(1)}mm，表頭已扣掉）`
              + `\n點一下 = ${S.breaks.includes(i+1) ? '取消在這裡停' : '就停在這一列'}`;
    lab.onclick = () => {
      const k = S.breaks.indexOf(i + 1);
      k < 0 ? S.breaks.push(i + 1) : S.breaks.splice(k, 1);
      S.breaks.sort((a,b) => a-b); render();
    };
    g.appendChild(lab);
  });
  sp.appendChild(g);
}

function setVar(){
  const r = document.documentElement.style;
  r.setProperty('--lh', S.lh); r.setProperty('--fs', S.fs); r.setProperty('--zoom', S.zoom); r.setProperty('--k', S.k);
  $('lhv').textContent = (+S.lh).toFixed(2);
  $('fsv').textContent = Math.round(S.fs*100) + '%';
  $('kv').textContent = Math.round(S.k*1000)/10 + '%';
}
function applyH(i){
  document.querySelectorAll(`tr[data-i="${i}"] .cw`).forEach(w => w.style.height = (S.h[i]*S.k).toFixed(2) + 'pt');
}
function select(i){
  sel = i;
  document.querySelectorAll('tr.sel').forEach(t => t.classList.remove('sel'));
  document.querySelectorAll(`tr[data-i="${i}"]`).forEach(t => t.classList.add('sel'));
  $('rh').disabled = i < 0; $('rh').value = i < 0 ? '' : S.h[i];
}
$('rh').onchange = e => { if (sel < 0) return; S.h[sel] = Math.max(4, +e.target.value); applyH(sel); render(); };

function fit(i){
  let px = 0;
  document.querySelectorAll(`tr[data-i="${i}"] .cw`).forEach(w => {
    const h = w.style.height; w.style.height = 'auto';
    px = Math.max(px, w.scrollHeight); w.style.height = h;
  });
  S.h[i] = Math.max(4, Math.ceil(px / PT / S.k * 10) / 10);
}

let drag = null;
const doc = $('doc');
doc.addEventListener('pointermove', e => {
  if (drag){
    S.h[drag.i] = Math.max(4, Math.round((drag.h0 + (e.clientY - drag.y) / S.zoom / PT / S.k) * 10) / 10);
    applyH(drag.i); return;
  }
  const tr = e.target.closest('tr[data-i]');
  doc.style.cursor = tr && (tr.getBoundingClientRect().bottom - e.clientY) < 5 * S.zoom ? 'row-resize' : '';
});
doc.addEventListener('pointerdown', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  const i = +tr.dataset.i; select(i);
  if ((tr.getBoundingClientRect().bottom - e.clientY) < 5 * S.zoom){
    drag = {i, y: e.clientY, h0: S.h[i]};
    e.preventDefault(); doc.setPointerCapture(e.pointerId);
  }
});
doc.addEventListener('pointerup', () => { if (drag){ drag = null; render(); } });
doc.addEventListener('dblclick', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  fit(+tr.dataset.i); render();
});
document.addEventListener('keydown', e => {
  if (!D || e.target.tagName === 'INPUT' || sel < 0) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    S.h[sel] = Math.max(4, S.h[sel] + (e.key === 'ArrowUp' ? -1 : 1) * (e.shiftKey ? 5 : 1));
    applyH(sel); e.preventDefault();
    clearTimeout(window._t); window._t = setTimeout(render, 250);
  }
  if (e.key.toLowerCase() === 'b') toggleBreak();
});
function toggleBreak(){
  if (sel <= 0) return;
  const k = S.breaks.indexOf(sel);
  k < 0 ? S.breaks.push(sel) : S.breaks.splice(k,1);
  S.breaks.sort((a,b) => a-b); render();
}

$('bbrk').onclick = toggleBreak;
$('bfit').onclick = () => { if (sel >= 0){ fit(sel); render(); } };
$('bfitall').onclick = () => { D.rows.forEach((_,i) => fit(i)); render(); };
$('bauto').onclick = () => {
  if (confirm('清掉全部 ' + S.breaks.length + ' 個手動分頁點，改成完全照列高流動？')){ S.breaks = []; render(); }
};
$('push').onchange = e => { S.push = e.target.checked; render(); };
$('bhtml').onclick = htmlLayout;
$('beven').onclick = () => evenOut(false);
$('bevenall').onclick = () => evenOut(true);
$('breset').onclick = () => { if (confirm('回到 Excel 原始列高與分頁？')){ S = JSON.parse(JSON.stringify(dflt)); bind(); render(); } };
$('bsave').onclick = () => {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
  a.download = D.name + '.layout.json'; a.click();
};
$('bload').onclick = () => {
  const f = el('input'); f.type = 'file'; f.accept = '.json';
  f.onchange = () => f.files[0].text().then(t => { S = Object.assign({}, dflt, JSON.parse(t)); bind(); render(); });
  f.click();
};
$('bprint').onclick = () => window.print();

function bind(){
  $('lh').value = S.lh; $('fs').value = S.fs; $('sh').value = S.sh;
  $('zm').value = S.zoom; $('k').value = S.k;
  $('push').checked = S.push;
  $('linkend').checked = S.linkEnd;
  $('shend').disabled = S.linkEnd;
  $('shend').value = endH();
  setVar();
}
const redraw = () => { clearTimeout(window._r); window._r = setTimeout(render, 150); };
$('k').oninput  = e => { S.k = +e.target.value; setVar(); redraw(); };
$('lh').oninput = e => { S.lh = +e.target.value; setVar(); redraw(); };
$('fs').oninput = e => { S.fs = +e.target.value; setVar(); redraw(); };
$('sh').onchange = e => { S.sh = +e.target.value; bind(); render(); };
$('shend').onchange = e => { S.shend = +e.target.value; render(); };
$('linkend').onchange = e => { S.linkEnd = e.target.checked; bind(); render(); };
$('zm').oninput = e => { S.zoom = +e.target.value; setVar(); };
</script>
</body>
</html>
