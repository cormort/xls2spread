<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>對開表排版</title>
<style>
:root{--fs:1;--lh:1.15;--zoom:1;--k:1}
*{box-sizing:border-box}
body{margin:0;background:#8a8a8a;font-family:'PingFang TC',sans-serif}

/* ---- 拖曳載入區 ---- */
#drop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;background:#2b2b2b;color:#eee;z-index:20;text-align:center;padding:24px}
#drop.hide{display:none}
#zone{border:3px dashed #777;border-radius:14px;padding:56px 72px;transition:.15s;cursor:pointer;max-width:640px}
#zone.on{border-color:#6cf;background:#33414d}
#zone h1{margin:0 0 10px;font-size:21px;font-weight:600}
#zone p{margin:6px 0;font-size:13px;color:#bbb;line-height:1.7}
#zone b{color:#eee}
#err{color:#ff8a8a;font-size:13px;white-space:pre-wrap;min-height:18px}
#drop small{color:#888;font-size:12px;max-width:620px;line-height:1.8}

#bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
     padding:8px 14px;background:#222;color:#eee;font-size:13px}
#bar.hide{display:none}
#bar b{font-weight:600}
#bar label{display:flex;gap:5px;align-items:center;white-space:nowrap}
#bar input[type=range]{width:96px}
#bar input[type=number]{width:64px;padding:2px 4px}
#bar button{padding:4px 9px;background:#444;color:#eee;border:1px solid #666;border-radius:4px;cursor:pointer}
#bar button:hover{background:#555}
#bar button.active{background:#36c;border-color:#58f}
.grp{display:inline-flex;gap:5px;align-items:center;padding:2px 7px;background:#2d2d2d;border-radius:5px;border:1px solid #444}
.grp select{background:#444;color:#eee;border:1px solid #666;border-radius:4px;padding:2px 4px;font-size:12px}
.grp-title{font-size:11px;color:#38bdf8;font-weight:700;margin-right:2px;letter-spacing:.5px}
.abtn{padding:2px 6px!important;min-width:22px;font-size:12px;font-weight:600}
#hint{opacity:.6;font-size:12px}

#doc{padding:20px;transform-origin:top left;transform:scale(var(--zoom));width:max-content}
#doc.fit-center{margin:0 auto;transform-origin:top center}
.spread{position:relative;display:flex;gap:12px;margin-bottom:18px;padding-left:58px}
.gut{position:absolute;left:0;top:0;width:54px;font-size:10px;color:#ddd;text-align:right}
.glab{position:absolute;right:4px;transform:translateY(-100%);cursor:pointer;white-space:nowrap}
.glab:hover{color:#fff;text-decoration:underline}
.glab.full{color:#ffd24a;font-weight:700}
.glab.brk{color:#7bf}
/* 螢幕上不裁切：一頁塞不下時，超出的資料列要看得見（配合紅色「超出 N mm」標籤），
   裁掉的話會像資料憑空不見。列印時才裁，交給 @page 處理。 */
.page{position:relative;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);flex:none}
.page.over-cap{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 2px #d00}
.tline{display:flex;align-items:flex-end;overflow:hidden}
.tline>span{flex:1;line-height:var(--lh)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td,th{padding:0;vertical-align:top;font-weight:400}
.cw{overflow:hidden;line-height:var(--lh);padding:0 3px}
.vc{display:flex;flex-direction:column;justify-content:center}
.dl{display:flex;justify-content:space-between}
.dl i{font-style:normal}
.editing .cw[contenteditable]{outline:1px dashed #6cf;outline-offset:-1px}
.editing .cw[contenteditable]:focus{outline:2px solid #06c;background:#eef6ff}
.editing .cw span[style*="FFFFFF"]{color:#c8c8c8!important}
.vb{display:flex;flex-direction:column;justify-content:flex-end}
tr.sel>td{background:#fff6cc}
tr.dragging>td{opacity:.4;background:#dbeafe!important}
tr.drag-target-before>td{box-shadow:inset 0 3px 0 #2563eb!important}
tr.drag-target-after>td{box-shadow:inset 0 -3px 0 #2563eb!important}
body.row-dragging, body.row-dragging *{cursor:grabbing!important;user-select:none!important}
.over{box-shadow:inset 0 -2px 0 #e00}
.pno{position:absolute;bottom:5mm;left:0;right:0;text-align:center;font-size:9pt;color:#333}
.badge{position:absolute;top:3px;right:5px;font-size:11px;color:#060;background:#eee;padding:1px 5px;border-radius:3px}
.badge.bad{color:#fff;background:#d00}
.mark{position:absolute;top:3px;left:5px;font-size:11px;color:#fff;background:#36c;padding:1px 6px;border-radius:3px;cursor:pointer}
.mark:hover{background:#d00}
tr.orphan>td{box-shadow:inset 0 -2px 0 #e8a000}
@media print{
  body{background:#fff}
  #bar,#drop,.badge,.mark{display:none}
  #doc{padding:0;transform:none;width:auto}
  .spread{display:block;margin:0;padding-left:0}
  .gut{display:none}
  .page{box-shadow:none;break-after:page;overflow:hidden}
  .page.over-cap{box-shadow:none}
  .spread:last-child .page:last-child{break-after:auto}
  tr.sel>td{background:none}
  tr.orphan>td{box-shadow:none}
  .over{box-shadow:none}
}
</style>
<style id="dyn"></style>
<style id="lineCss"></style>
</head>
<body>

<div id="drop">
  <div id="zone">
    <h1>把 .xlsx 拖進來</h1>
    <p>或<b>點這裡選檔案</b></p>
    <p>版面（左右頁分欄、分頁、重複表頭、紙張邊界、列高欄寬字型框線）<br>全部從檔案的列印設定讀出來</p>
  </div>
  <div id="err"></div>
  <small>只吃 .xlsx。舊的 .xls 請先在 Excel 裡「另存新檔 → Excel 活頁簿 (.xlsx)」，
  或用 <b>xls2spread.py</b> 轉。<br>檔案不會上傳，全部在你這台電腦的瀏覽器裡處理。</small>
  <input type="file" id="file" accept=".xlsx" hidden>
</div>

<div id="bar" class="hide">
  <b id="fname"></b>

  <span class="grp">
    <span class="grp-title">結構</span>
    <label title="選擇左右頁的分界欄位，左邊的欄歸左頁、右邊的歸右頁">分欄<select id="split"></select></label>
    <label title="列印範圍（A1 格式，例如 A1:T245）。&#10;檔案有設「列印範圍」時自動帶入；沒設就抓有資料的最大範圍。&#10;改這裡等於重新框要排版的區域，列高與分頁會重算。">範圍<input type="text" id="parea" size="10" placeholder="A1:T245"></label>
    <label title="表頭（每頁重複的標題＋欄位名稱）到第幾列為止，下一列開始算資料列。&#10;檔案有設「列印標題」時自動帶入；舊版 .xls 轉檔後通常沒有，要手動填。&#10;填 0 = 沒有表頭。">表頭到<input type="number" id="hdrLast" min="0" step="1">列</label>
  </span>

  <span class="grp">
    <span class="grp-title">文字</span>
    <label title="全域字型設定，切換後自動重新計算列高">字型
      <select id="fontFam">
        <option value="">原檔字型</option>
        <option value="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC',sans-serif">微軟正黑體</option>
        <option value="'PMingLiU','Songti TC','Noto Serif CJK TC',serif">新細明體</option>
        <option value="'MingLiU','Songti TC',serif">細明體</option>
        <option value="'DFKai-SB','BiauKai','Songti TC',serif">標楷體</option>
        <option value="'PingFang TC','Microsoft JhengHei',sans-serif">蘋方 (PingFang)</option>
        <option value="'Noto Sans CJK TC','PingFang TC',sans-serif">思源黑體</option>
        <option value="'Noto Serif CJK TC','Songti TC',serif">思源宋體</option>
      </select>
    </label>
    <label title="設定表頭標題的對齊方式">標題對齊
      <select id="titleAlign">
        <option value="seam">中縫接續</option>
        <option value="center">置中</option>
        <option value="left">靠左</option>
        <option value="right">靠右</option>
      </select>
    </label>
    <label title="字級倍率，1 = 原始大小；調大字會變大但可能溢出格子">字級<input type="range" id="fs" min="0.7" max="1.4" step="0.01"><span id="fsv"></span></label>
    <label title="CSS 行距，影響同一格內多行文字之間的距離">行距<input type="range" id="lh" min="0.9" max="2" step="0.05"><span id="lhv"></span></label>
  </span>

  <span class="grp">
    <span class="grp-title">版面</span>
    <label title="Excel 的列印縮放比例，影響文字和框線的實際大小">縮放<input type="range" id="k" min="0.5" max="1.2" step="0.005"><span id="kv"></span></label>
    <label title="每一列額外墊高，等於拉開它跟下一列之間的距離；全部頁面一起套用">列間距<input type="range" id="gap" min="0" max="24" step="0.5"><span id="gapv"></span></label>
    <label title="表頭天線到地線之間的總高（mm）。這個值決定每頁能塞多少資料列：&#10;• 資料列不夠填滿時，地線會靠一列空白列撐到這個位置&#10;• 資料列太多時會自動分頁&#10;• 預設值 = 紙張高 − 上下邊界 − 標題區高度&#10;• 所有頁面共用同一個值，地線才會對齊">天地線高<input type="number" id="sh" step="0.5">mm</label>
    <label title="每頁第一列跟表頭下邊線之間的留白（pt），只影響每頁的第一列">首列留白<input type="number" id="hgap" step="0.5" min="0" max="30">pt</label>
    <label title="按「平均列高」時，不換行的單行列統一設成這個高度（pt）；&#10;內容需要更高時以內容為準，不會切字。">單行列高<input type="number" id="oneh" step="0.5" min="4">pt</label>
    <label title="天線（表頭上緣）與地線（表格下緣）的粗細，「上線／左線」等手動加的框線也用這個值">線粗<input type="number" id="bpt" step="0.25" min="0" max="3">pt</label>
    <label title="勾選：末頁的天地線高跟其他頁一樣，合計與備註會被包在這個高度裡，備註底部自然對齊其他頁的地線。&#10;不勾：末頁可以用獨立的高度值（右邊的數字），不受其他頁牽制。">
      <input type="checkbox" id="linkend">末頁對齊地線<input type="number" id="shend" step="0.5">mm</label>
  </span>

  <span class="grp">
    <span class="grp-title">選取列</span>
    <label title="目前選取列的高度（pt），可直接輸入數字修改"><input type="number" id="rh" step="0.5" disabled>pt</label>
    <button id="bfit" title="把目前選取的那一列壓到文字實際需要的最小高度">最小列高</button>
    <button id="bbrk" title="在目前選取列之前插入手動分頁（快捷鍵 B），再按一次取消">此列前分頁 (B)</button>
    <button id="bdel" title="從版面刪掉目前選取的資料列。&#10;復原鍵救不回來，會先問一次。&#10;匯出 xlsx 時原檔那一列會被設成隱藏，不是真的刪除。">刪除本列</button>
    <button id="brb_t" class="abtn" title="選取列只畫上框線">上線</button>
    <button id="brb_b" class="abtn" title="選取列只畫下框線">下線</button>
    <button id="brb_both" class="abtn" title="選取列上下都畫框線">上下</button>
    <button id="brb_n" class="abtn" title="選取列不畫上下框線">無線</button>
  </span>

  <span class="grp" id="footGrp">
    <span class="grp-title">合計/備註</span>
    <select id="footSel" title="選擇末頁的合計列或備註列"></select>
    <label title="該列的高度（pt）。改了會即時重排，末頁容量也會跟著算"><input type="number" id="footH" step="0.5" min="4">pt</label>
  </span>

  <span class="grp" id="colGrp">
    <span class="grp-title">整欄</span>
    <select id="colAlignSelect" title="選擇要設定對齊與框線的欄位"></select>
    <button id="bcol_l" class="abtn" title="該欄靠左對齊">左</button>
    <button id="bcol_c" class="abtn" title="該欄置中對齊">中</button>
    <button id="bcol_r" class="abtn" title="該欄靠右對齊">右</button>
    <button id="bcol_d" class="abtn" title="該欄分散對齊">散</button>
    <button id="bcol_j" class="abtn" title="該欄左右對齊（兩端對齊，換行後末行靠左）">齊</button>
    <button id="bcb_l" class="abtn" title="該欄只畫左框線">左線</button>
    <button id="bcb_r" class="abtn" title="該欄只畫右框線">右線</button>
    <button id="bcb_both" class="abtn" title="該欄左右都畫框線">左右</button>
    <button id="bcb_n" class="abtn" title="該欄不畫左右框線">無線</button>
  </span>

  <span class="grp">
    <span class="grp-title">本頁</span>
    <button id="bfitpage" title="只把這一頁的每一列壓到文字實際需要的高度">最小列高</button>
    <button id="beven" title="單行列先壓回最小高度固定住，該頁剩下的空白只分給會換行的多行列。&#10;整頁都沒有多行列時，才平均分給每一列。空白間隔列不動。">平均列高</button>
  </span>

  <span class="grp">
    <span class="grp-title">全部</span>
    <button id="bfitall" title="把所有頁面的每一列都壓到文字實際需要的最小高度">最小列高</button>
    <button id="bevenall" title="每一頁都做：單行列壓回最小高度固定住，剩下的空白只分給會換行的多行列">平均列高</button>
    <button id="bhtml" title="忽略 Excel 原始列高與分頁，全部依內容重新排版（要回原樣按「重設」）">HTML 重排</button>
    <button id="bauto" title="清掉所有手動分頁點，改成完全照列高自動流動分頁">清手動分頁</button>
    <label title="打勾後分頁會依列高自動計算，列高改變時頁面會重新流動"><input type="checkbox" id="push">自動分頁</label>
  </span>

  <span class="grp">
    <span class="grp-title">檢視</span>
    <label title="畫面檢視縮放，不影響列印，只影響螢幕上看到的大小"><input type="range" id="zm" min="0.3" max="1.5" step="0.05"></label>
    <button id="bview" title="切換顯示模式：滿高（一頁剛好塞滿視窗高度）/ 滿寬（對開塞滿視窗寬度）/ 自訂（手動拉檢視滑桿）">滿高</button>
    <label title="打開後可直接點資料格改字，改完會自動重新計算最小列高；原檔用來對齊的白色補位字會顯示成灰色，方便刪掉"><input type="checkbox" id="edit">編輯內容</label>
    <button id="bundo" title="復原上一步（⌘Z / Ctrl+Z）。註：拖曳換列的順序不在復原範圍內" disabled>復原</button>
    <button id="bredo" title="重做（⇧⌘Z / Ctrl+Shift+Z）" disabled>重做</button>
  </span>

  <span class="grp">
    <span class="grp-title">檔案</span>
    <button id="bprint" title="開啟瀏覽器的列印對話框，可以直接印出或存成 PDF">列印 / 存 PDF</button>
    <button id="bxlsx" title="把調好的列高與分頁寫回 xlsx，其餘內容原封不動，可回 Excel 再微調">匯出 xlsx</button>
    <button id="bsave" title="把目前的列高、分頁、縮放等設定匯出成 JSON 檔，下次可匯入還原">匯出設定</button>
    <button id="bload" title="匯入之前匯出的 JSON 設定檔，還原列高、分頁等設定">匯入設定</button>
    <button id="breset" title="回到 Excel 原始的列高與分頁，放棄所有調整">重設</button>
    <button id="bnew" title="關閉目前的檔案，回到拖曳載入畫面換一個檔案">換檔案</button>
  </span>

  <span id="hint">單列調高：拖該列下緣，或點選後用 ↑↓ (Shift×5)／直接填列高｜拖曳資料列可換順序（亦可 Alt+↑/↓）｜雙擊＝最小列高｜左右頁同一列永遠同高</span>
</div>

<div id="doc"></div>

<script>
/* ============================ 讀 xlsx ============================ */
/* ponytail: 用瀏覽器內建的 DecompressionStream 解 zip、DOMParser 解 XML，不帶任何函式庫。
   只處理一般 xlsx（非 zip64、非加密）；真的遇到再換 SheetJS。 */

async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eo = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if (eo < 0) throw new Error('這不是有效的 xlsx（找不到 zip 結構）');
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const files = {};
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip 目錄壞掉');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el_ = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method, csize, lho: dv.getUint32(p + 42, true)};
    p += 46 + nl + el_ + cl;
  }
  return {u8, dv, files};
}

async function entryBytes(z, name){
  const f = z.files[name];
  if (!f) return null;
  const nl = z.dv.getUint16(f.lho + 26, true), el_ = z.dv.getUint16(f.lho + 28, true);
  const start = f.lho + 30 + nl + el_;
  const bytes = z.u8.subarray(start, start + f.csize);
  if (f.method === 0) return bytes;
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function entry(z, name){
  const b = await entryBytes(z, name);
  return b && new TextDecoder().decode(b);
}

// --- 寫回 zip：只換掉工作表那一份，其餘位元組原封不動搬過去 ---
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; };

async function zipWrite(entries){
  const enc = new TextEncoder(), body = [], cdir = [];
  let off = 0;
  for (const e of entries){
    const nameB = enc.encode(e.name);
    const comp = new Uint8Array(await new Response(
      new Blob([e.bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    const crc = crc32(e.bytes);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 8, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true); lh.setUint32(22, e.bytes.length, true);
    lh.setUint16(26, nameB.length, true);
    body.push(new Uint8Array(lh.buffer), nameB, comp);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(10, 8, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, comp.length, true); cd.setUint32(24, e.bytes.length, true);
    cd.setUint16(28, nameB.length, true); cd.setUint32(42, off, true);
    cdir.push(new Uint8Array(cd.buffer), nameB);
    off += 30 + nameB.length + comp.length;
  }
  const cdBytes = cdir.reduce((a,b) => a + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdBytes, true); eo.setUint32(16, off, true);
  return new Blob([...body, ...cdir, new Uint8Array(eo.buffer)],
                  {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const colNum = ref => { let n = 0; for (const c of ref){ const v = c.charCodeAt(0); if (v < 65) break; n = n*26 + (v-64); } return n; };
const rowNum = ref => +ref.match(/\d+/)[0];
const colName = n => { let s = ''; while (n > 0){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = (n-1-m)/26; } return s; };

const BUILTIN_FMT = {0:'General',1:'0',2:'0.00',3:'#,##0',4:'#,##0.00',9:'0%',10:'0.00%',
  37:'#,##0_);(#,##0)',38:'#,##0_);[Red](#,##0)',39:'#,##0.00_);(#,##0.00)',40:'#,##0.00_);[Red](#,##0.00)',49:'@'};

function fmtNum(v, nf){
  const secs = (nf || '').split(';');
  if (v === 0 && secs.length >= 3 && secs[2].includes('-')) return '-';
  if (!nf || nf === 'General' || nf === '@') return String(Math.round(v * 1e10) / 1e10);
  const dec = nf.includes('0.00') ? 2 : 0;
  return nf.includes('#,##0')
    ? v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec})
    : v.toFixed(dec);
}

const BW = {hair:.25, thin:.5, medium:1, thick:1.5, double:1, dashed:.5, dotted:.5, mediumDashed:1};
const FONT_STACK = {
  '微軟正黑體': "'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC',sans-serif",
  '新細明體': "'PMingLiU','Songti TC','Noto Serif CJK TC',serif",
  '細明體': "'MingLiU','Songti TC',serif",
  '華康中明體': "'DFKai-SB','Songti TC',serif",
  '華康中黑體': "'PingFang TC','Microsoft JhengHei',sans-serif",
  'Times New Roman': "'Times New Roman',Times,serif"
};
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Excel 寫 1/0，LibreOffice 寫 true/false，兩種都要認
const isOn = v => v != null && v !== '0' && v !== 'false';
const flagOf = e => !!e && isOn(e.getAttribute('val') ?? '1');
const rgbOf = el_ => {
  const c = el_ && el_.getAttribute('rgb');
  if (!c) return null;
  const h = c.slice(-6);
  return h === '000000' ? null : '#' + h;
};

let SRC = null;   // 原始 xlsx 的位元組與工作表路徑，匯出時要用
let RAW = null;   // buildModel 的原始輸入，換分欄時重跑用

async function parseXlsx(buf, fileName){
  const z = await unzip(buf);
  const wb = xml(await entry(z, 'xl/workbook.xml'));
  const rels = xml(await entry(z, 'xl/_rels/workbook.xml.rels'));
  const relMap = {};
  rels.querySelectorAll('Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));

  const sheets = [...wb.querySelectorAll('sheets > sheet')].map((s,i) => ({
    name: s.getAttribute('name'), idx: i,
    path: 'xl/' + (relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')] || '')
                    .replace(/^\/?xl\//, '')
  }));

  const defName = (nm, idx) => {
    const d = [...wb.querySelectorAll('definedNames > definedName')]
      .find(d => d.getAttribute('name') === nm && +d.getAttribute('localSheetId') === idx);
    return d ? d.textContent : null;
  };

  // 挑有列印範圍的工作表；沒有就挑資料最多的
  let pick = sheets.find(s => defName('_xlnm.Print_Area', s.idx));
  if (!pick){
    let best = -1;
    for (const s of sheets){
      const t = await entry(z, s.path);
      if (t && t.length > best){ best = t.length; pick = s; }
    }
  }
  if (!pick) throw new Error('找不到工作表');

  SRC = {z, path: pick.path, name: fileName};
  const sh = xml(await entry(z, pick.path));
  const st = xml(await entry(z, 'xl/styles.xml'));
  const ssTxt = await entry(z, 'xl/sharedStrings.xml');

  // --- 樣式 ---
  const numFmt = {...BUILTIN_FMT};
  st.querySelectorAll('numFmts > numFmt').forEach(f => numFmt[+f.getAttribute('numFmtId')] = f.getAttribute('formatCode'));
  const fonts = [...st.querySelectorAll('fonts > font')].map(f => ({
    name: (f.querySelector('name') || f.querySelector('rFont') || {getAttribute:()=>null}).getAttribute('val'),
    sz: +((f.querySelector('sz') || {getAttribute:()=>11}).getAttribute('val') || 11),
    b: flagOf(f.querySelector('b')),
    color: rgbOf(f.querySelector('color'))
  }));
  const borders = [...st.querySelectorAll('borders > border')].map(b => {
    const g = t => { const e = b.querySelector(t); return e ? e.getAttribute('style') : null; };
    return {left: g('left'), right: g('right'), top: g('top'), bottom: g('bottom')};
  });
  const xfs = [...st.querySelectorAll('cellXfs > xf')].map(x => {
    const a = x.querySelector('alignment');
    return {
      numFmtId: +(x.getAttribute('numFmtId') || 0),
      fontId: +(x.getAttribute('fontId') || 0),
      borderId: +(x.getAttribute('borderId') || 0),
      h: a && a.getAttribute('horizontal'), v: a && a.getAttribute('vertical'),
      wrap: !!(a && isOn(a.getAttribute('wrapText'))),
      indent: +((a && a.getAttribute('indent')) || 0)
    };
  });

  // --- 共用字串（保留 rich text 的顏色，白字是原檔用來縮排的） ---
  const shared = ssTxt ? [...xml(ssTxt).querySelectorAll('sst > si')].map(si => {
    const rs = [...si.querySelectorAll(':scope > r')];
    if (!rs.length){ const t = si.querySelector('t'); return [{t: t ? t.textContent : '', c: null}]; }
    return rs.map(r => ({t: (r.querySelector('t') || {textContent:''}).textContent,
                         c: rgbOf(r.querySelector('rPr > color'))}));
  }) : [];

  // --- 儲存格 ---
  const cells = {}, rowH = {}, hidden = new Set();
  sh.querySelectorAll('sheetData > row').forEach(r => {
    const ri = +r.getAttribute('r');
    const ht = r.getAttribute('ht');
    if (ht) rowH[ri] = +ht;
    if (isOn(r.getAttribute('hidden'))) hidden.add(ri);
    r.querySelectorAll('c').forEach(c => {
      const ref = c.getAttribute('r');
      const vEl = c.querySelector('v'), isEl = c.querySelector('is');
      cells[ref] = {s: +(c.getAttribute('s') || 0), t: c.getAttribute('t'),
                    v: vEl ? vEl.textContent : null,
                    is: isEl ? [...isEl.querySelectorAll('r')].map(r2 => ({t:(r2.querySelector('t')||{textContent:''}).textContent, c: rgbOf(r2.querySelector('rPr > color'))}))
                              .concat(isEl.querySelector(':scope > t') ? [{t: isEl.querySelector(':scope > t').textContent, c: null}] : []) : null};
    });
  });

  const defRowH = +((sh.querySelector('sheetFormatPr') || {getAttribute:()=>null}).getAttribute('defaultRowHeight') || 16.5);
  const colW = {};
  sh.querySelectorAll('cols > col').forEach(c => {
    const w = +c.getAttribute('width');
    for (let i = +c.getAttribute('min'); i <= +c.getAttribute('max'); i++) colW[i] = w;
  });

  const merges = {};
  const skip = new Set();
  sh.querySelectorAll('mergeCells > mergeCell').forEach(m => {
    const [a, b] = m.getAttribute('ref').split(':');
    const c1 = colNum(a), r1 = rowNum(a), c2 = colNum(b), r2 = rowNum(b);
    merges[r1 + ',' + c1] = [r2 - r1 + 1, c2 - c1 + 1];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r !== r1 || c !== c1) skip.add(r + ',' + c);
  });

  const pm = sh.querySelector('pageMargins') || {getAttribute: () => null};
  const ps = sh.querySelector('pageSetup') || {getAttribute: () => null};
  const num = (v, d) => v == null ? d : +v;

  RAW = {
    fileName, sheetName: pick.name,
    printArea: defName('_xlnm.Print_Area', pick.idx),
    printTitles: defName('_xlnm.Print_Titles', pick.idx),
    colBreaks: [...sh.querySelectorAll('colBreaks > brk')].map(b => +b.getAttribute('id')),
    rowBreaks: [...sh.querySelectorAll('rowBreaks > brk')].map(b => +b.getAttribute('id')),
    landscape: ps.getAttribute('orientation') === 'landscape',
    fitToPage: isOn((sh.querySelector('sheetPr > pageSetUpPr') || {getAttribute:()=>null}).getAttribute('fitToPage')),
    scale: +(ps.getAttribute('scale') || 100),
    margins: {l: num(pm.getAttribute('left'), .75), r: num(pm.getAttribute('right'), .75),
              t: num(pm.getAttribute('top'), 1), b: num(pm.getAttribute('bottom'), 1)},
    cells, rowH, hidden, defRowH, colW, merges, skip, shared, xfs, fonts, borders, numFmt
  };
  return buildModel(RAW);
}

/* ============================ 組版面模型 ============================ */

function buildModel(x){
  const A1 = s => { const m = s.replace(/\$/g,'').split('!').pop().split(':');
                    return [colNum(m[0]), rowNum(m[0]), colNum(m[1]), rowNum(m[1])]; };
  let c1 = 1, r1 = 1, c2 = 1, r2 = 1;
  // 列印範圍：工具列手動指定的優先，其次是檔案裡的 Print_Area，都沒有就抓有資料的最大範圍
  if (x._areaOverride) [c1, r1, c2, r2] = A1(x._areaOverride);
  else if (x.printArea) [c1, r1, c2, r2] = A1(x.printArea);
  else {
    for (const ref in x.cells){ c2 = Math.max(c2, colNum(ref)); r2 = Math.max(r2, rowNum(ref)); }
  }
  let split = x.colBreaks.length ? x.colBreaks[0] : c2;
  // 手動指定的分欄優先
  if (x._splitOverride != null) split = x._splitOverride;
  const halves = {l: [], r: []};
  for (let c = c1; c <= c2; c++) (c <= split ? halves.l : halves.r).push(c);
  if (!halves.r.length){ halves.r = halves.l.splice(Math.ceil(halves.l.length/2)); }

  // 表頭範圍優先看檔案的「列印標題」；沒設的話（很多舊 .xls 轉過來就是這樣）預設沒有表頭，
  // 使用者可以用工具列的「表頭到第 N 列」手動指定，否則整份會被當成資料列、沒有重複表頭也沒有天線。
  const hdrLast = x._hdrOverride != null ? x._hdrOverride
                : (x.printTitles ? +x.printTitles.replace(/\$/g,'').split('!').pop().split(':')[1] : r1 - 1);
  const hdrEnd = Math.min(hdrLast, r2 - 1);   // 至少留一列資料，否則整份會變空
  const hdrRows = []; for (let r = r1; r <= hdrEnd; r++) hdrRows.push(r);
  const dataRows = []; for (let r = hdrEnd + 1; r <= r2; r++) dataRows.push(r);

  const xfOf = ref => x.xfs[(x.cells[ref] || {s:0}).s] || x.xfs[0] || {};
  const bdOf = ref => x.borders[xfOf(ref).borderId] || {};

  // CSS class 收斂
  const cssMap = new Map(), css = [];
  function cls(ref, nohz, nobd){
    const xf = xfOf(ref), f = x.fonts[xf.fontId] || {}, b0 = bdOf(ref);
    const b = nobd ? {} : b0;    // 標題區不畫框線：天線是第一列表頭的上框線畫的，重複畫會變粗
    const sig = [f.name, f.sz, !!f.b, f.color, xf.h, xf.v, xf.wrap, xf.indent,
                 b.left, b.right, nohz ? null : b.top, nohz ? null : b.bottom].join('|');
    if (cssMap.has(sig)) return cssMap.get(sig);
    const nm = 'c' + cssMap.size;
    cssMap.set(sig, nm);
    const d = [`font-family:var(--user-font, ${FONT_STACK[f.name] || 'sans-serif'})`,
               `font-size:calc(${f.sz || 11}pt * var(--fs) * var(--k))`];
    if (f.b) d.push('font-weight:700');
    if (f.color) d.push(`color:${f.color}`);
    d.push(`text-align:${xf.h === 'distributed' ? 'center' : (xf.h || 'left')}`);
    if (xf.indent) d.push(`padding-left:calc(${xf.indent * .5}em + 2px)`);
    d.push('white-space:' + (xf.wrap ? 'pre-wrap' : 'pre'));
    css.push(`.${nm}{${d.join(';')}}`);
    // 框線畫在 td 上，讓 border-collapse 把相鄰的合成一條連續線。
    // 畫在內層 div 的話，一條縱線會變成每列一小段、左右兩格各畫一次，接縫在非整數像素上會忽粗忽細。
    const bd = [];
    [['left',b.left],['right',b.right],['top',nohz?null:b.top],['bottom',nohz?null:b.bottom]]
      .forEach(([s,v]) => { if (v) bd.push(`border-${s}:${BW[v] || .5}pt solid #000`); });
    if (bd.length) css.push(`td.${nm},th.${nm}{${bd.join(';')}}`);
    return nm;
  }

  const VAL = {center:'vc', bottom:'vb'};
  function cell(r, c, nohz, nobd){
    if (x.skip.has(r + ',' + c)) return null;
    const ref = colName(c) + r, cv = x.cells[ref];
    const xf = xfOf(ref);
    let t = '';
    if (cv && cv.v != null){
      if (cv.t === 's'){
        t = (x.shared[+cv.v] || []).map(run => run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t)).join('');
        // 白字是「換行後的縮排」，補上換行，換行點才不會隨字型跑掉
        const runs = x.shared[+cv.v] || [];
        let plain = '', out = '';
        runs.forEach(run => {
          if (/^#f{2}f{2}f{2}$/i.test(run.c || '') && plain && !plain.endsWith('\n')){ out += '\n'; plain += '\n'; }
          out += run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t);
          plain += run.t;
        });
        t = out;
      } else if (cv.t === 'str' || cv.t === 'e'){ t = esc(cv.v); }
      else if (cv.t === 'b'){ t = cv.v === '1' ? 'TRUE' : 'FALSE'; }
      else { t = esc(fmtNum(+cv.v, x.numFmt[xf.numFmtId])); }
    } else if (cv && cv.is){
      t = cv.is.map(run => run.c ? `<span style="color:${run.c}">${esc(run.t)}</span>` : esc(run.t)).join('');
    }
    // 分散對齊：Excel 是把字平均攤滿整格。用 CSS justify 在 CJK 上各家瀏覽器不一致，
    // 直接把每個字包起來用 flex 推開，結果才穩定。
    if (xf.h === 'distributed' && t)
      t = t.split('\n').map(line =>
        '<span class="dl">' + [...line].map(ch => '<i>' + ch + '</i>').join('') + '</span>').join('');
    const m = x.merges[r + ',' + c] || [1,1];
    const o = {t, c: cls(ref, nohz, nobd), col: c};
    if (VAL[xf.v]) o.v = VAL[xf.v];
    if (m[0] > 1) o.rs = m[0];
    if (m[1] > 1) o.cs = m[1];
    return o;
  }

  const rowh = r => Math.round((x.rowH[r] || x.defRowH) * 100) / 100;
  const plain = t => t.replace(/<[^>]*>/g, '').replace(/[\s\u3000]/g, '');
  const pack = (rows, nohz, nobd) => rows.map(r => {
    const l = halves.l.map(c => cell(r, c, nohz, nobd)).filter(Boolean);
    const rr = halves.r.map(c => cell(r, c, nohz, nobd)).filter(Boolean);
    return {
      h: rowh(r), l, r: rr,
      ind: xfOf(colName(halves.l[0]) + r).indent || 0,   // 縮排層級，用來認出群組標題
      blank: !l.concat(rr).some(c => plain(c.t))         // 整列空白
    };
  });

  const allc = halves.l.concat(halves.r);
  // 有垂直框線才算表格本體；只有底線（天線）的仍屬標題區
  const framed = r => allc.some(c => { const b = bdOf(colName(c) + r); return b.left || b.right; });
  const titleRows = hdrRows.filter(r => !framed(r));
  const headRows = hdrRows.filter(r => framed(r));

  // 合計列（下框線是粗線）與其後的附註列 -> 釘在天地線位置
  // Excel 裡看不見的列不要輸出：hidden 旗標的，或列高被壓到比字級還小的（原檔拿來當間隔用，
  // 裡面常留著沒清掉的舊資料，撐開來就會冒出不該出現的東西）
  const fontSz = r => ((x.fonts[xfOf(colName(halves.l[0]) + r).fontId] || {}).sz || 11);
  const unseen = r => x.hidden.has(r) || rowh(r) < fontSz(r);

  const pinned = dataRows.filter(r => allc.some(c => bdOf(colName(c) + r).bottom === 'medium'));
  const footFrom = pinned.length ? pinned[pinned.length-1] : r2 + 1;
  const bodyRows = dataRows.filter(r => r < footFrom && !unseen(r));
  const footRows = dataRows.filter(r => r >= footFrom && !unseen(r));

  const widths = side => {
    const w = halves[side].map(c => x.colW[c] || 8.43), t = w.reduce((a,b) => a+b, 0);
    return w.map(v => Math.round(v / t * 1e6) / 1e4);
  };

  // rowBreaks 的 id 是「這一列之後分頁」，下一頁從 id+1 開始
  const breaks = x.rowBreaks.map(r => bodyRows.indexOf(r) + 1)
                            .filter(i => i > 0 && i < bodyRows.length).sort((a,b) => a-b);

  // Excel fitToPage 的縮放率沒存在檔裡。它是照「欄寬」縮的：把較寬的那半頁縮到版心寬度。
  // 欄寬單位是字元數，換算像素要乘 MDW（預設字型的數字寬度），每欄再加 5px 邊距。
  const ph = x.landscape ? 210 : 297, pw = x.landscape ? 297 : 210;
  const mdw = Math.max(1, Math.round((x.fonts[0] && x.fonts[0].sz || 11) * 96 / 72 * .5));
  const printablePx = (pw - (x.margins.l + x.margins.r) * 25.4) / 25.4 * 96;
  const naturalPx = Math.max(...['l','r'].map(s =>
    halves[s].reduce((a,c) => a + (x.colW[c] || 8.43), 0) * mdw + 5 * halves[s].length));
  const k = x.fitToPage ? Math.min(1, Math.round(printablePx / naturalPx * 1e4) / 1e4)
                        : (x.scale || 100) / 100;

  // 偵測天線粗細：取第一列表頭的上框線樣式，地線要畫成跟它一樣粗
  let topBorderStyle = 'thin';   // 預設 thin
  if (headRows.length) {
    const firstHR = headRows[0];
    for (const c of allc) {
      const b = bdOf(colName(c) + firstHR);
      if (b.top) { topBorderStyle = b.top; break; }
    }
  }
  const topBorderPt = BW[topBorderStyle] || .5;

  return {
    name: x.fileName, sheet: x.sheetName, k,
    page: {w: pw, h: ph, ml: +(x.margins.l * 25.4).toFixed(2), mr: +(x.margins.r * 25.4).toFixed(2),
           mt: +(x.margins.t * 25.4).toFixed(2), mb: +(x.margins.b * 25.4).toFixed(2)},
    cols: {l: widths('l'), r: widths('r')},
    title: pack(titleRows, true, true), head: pack(headRows),
    rows: pack(bodyRows, true), foot: pack(footRows),
    rowNums: bodyRows,        // 匯出 xlsx 時要把列高寫回原本的列號
    footNums: footRows,       // 合計＋備註的原始列號，編輯內容寫回時要用
    breaks, css, topBorderPt, splitCol: split, c1, c2, r1, r2, hdrLast: hdrEnd,
    area: colName(c1) + r1 + ':' + colName(c2) + r2
  };
}

/* ============================ 載入流程 ============================ */
const $ = id => document.getElementById(id);
const el = (t,c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

const zone = $('zone');
zone.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); if ($('drop').classList.contains('hide')) return; zone.classList.add('on');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('on'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
$('bnew').onclick = () => { $('drop').classList.remove('hide'); $('bar').classList.add('hide'); $('doc').innerHTML = ''; };

async function load(file){
  $('err').textContent = '';
  if (/\.xls$/i.test(file.name)){
    $('err').textContent = '這是舊版 .xls，瀏覽器讀不了。\n請在 Excel 另存為 .xlsx，或用 xls2spread.py 轉。';
    return;
  }
  try {
    zone.querySelector('h1').textContent = '讀取中…';
    const model = await parseXlsx(await file.arrayBuffer(), file.name);
    start(model);
  } catch (e){
    $('err').textContent = '讀取失敗：' + e.message;
    console.error(e);
  } finally {
    zone.querySelector('h1').textContent = '把 .xlsx 拖進來';
  }
}

/* ============================ 編輯器 ============================ */
let D, S, dflt, titlePt, headPt, sel = -1;
const MM = 96/25.4, PT = 96/72;
let KEY = '', store = {get: () => ({}), set: () => {}};

function start(model, keepSettings){
  D = model;
  if (!D.rows.length) throw new Error('列印範圍內沒有資料列');
  KEY = 'spread:' + D.name + ':' + D.sheet;
  store = {
    get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
    set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
  };
  titlePt = D.title.reduce((s,r) => s + r.h, 0);
  headPt  = D.head.reduce((s,r) => s + r.h, 0);
  const shDflt = +((D.page.h - D.page.mt - D.page.mb) - titlePt * D.k / 72 * 25.4).toFixed(1);
  dflt = {h: D.rows.map(r => r.h), breaks: D.breaks.slice(),
          lh: 1.15, fs: 1, zoom: .5, k: D.k, push: true, sh: shDflt, shend: shDflt, linkEnd: true, gap: 0, edits: {},
          colAligns: {}, titleAlign: 'seam',
          rowBorders: {}, colBorders: {}, borderPt: D.topBorderPt || .5, headGap: 3,
          footH: D.foot.map(r => r.h), oneLineH: 20};
  if (keepSettings && S && S.h.length === D.rows.length){
    // 換分欄時保留使用者的列高、分頁、縮放等設定，只清掉可能失效的編輯與欄寬
    S.edits = {};
    S.colWidths = null;
  } else {
    const saved = store.get();
    S = Object.assign({}, dflt, saved);
    S.h = S.h.slice(); S.breaks = S.breaks.slice(); S.edits = Object.assign({}, S.edits);
    if (S.h.length !== D.rows.length){ S.h = dflt.h.slice(); S.breaks = dflt.breaks.slice(); }
  }
  sel = -1;
  var firstTime = !keepSettings && !Object.keys(store.get()).length;

  $('dyn').textContent = D.css.join('\n')
    + `\n@media print{@page{size:${D.page.w}mm ${D.page.h}mm;margin:0}`
    + `.page{height:calc(${D.page.h}mm - 0.2mm)!important}}`;
  $('fname').textContent = D.name + ' / ' + D.sheet;
  $('drop').classList.add('hide');
  $('bar').classList.remove('hide');
  undoStack = []; redoStack = []; lastSnap = null;   // 換檔／換分欄，復原歷史重來
  populateSplitSelect();
  bind(); render();
  if (firstTime) htmlLayout();
}

function populateSplitSelect(){
  const sel = $('split');
  sel.innerHTML = '';
  for (let c = D.c1; c < D.c2; c++){
    const o = el('option');
    o.value = c; o.textContent = colName(c) + ' | ' + colName(c+1);
    if (c === D.splitCol) o.selected = true;
    sel.appendChild(o);
  }
}
function populateFootSelect(){
  const sel = $('footSel');
  sel.innerHTML = '';
  D.foot.forEach((r, k) => {
    const o = el('option');
    o.value = k; o.textContent = k === 0 ? '合計' : '備註' + (D.foot.length > 2 ? k : '');
    sel.appendChild(o);
  });
  sel.disabled = !D.foot.length;
  $('footH').disabled = !D.foot.length;
  if (D.foot.length) $('footH').value = footHt(+sel.value);
  else $('footH').value = '';
}
function populateColAlignSelect(){
  const selEl = $('colAlignSelect');
  if (!selEl || !D) return;
  selEl.innerHTML = '';
  for (let c = D.c1; c <= D.c2; c++){
    const o = el('option');
    o.value = c;
    o.textContent = `欄 ${colName(c)}`;
    selEl.appendChild(o);
  }
  // 預設停在 G 欄（最常調的那欄）；超出範圍就退回第一欄
  selEl.value = S.colTarget != null ? S.colTarget : 7;
  if (!selEl.value) selEl.selectedIndex = 0;
  S.colTarget = +selEl.value;
}
$(`split`).onchange = e => {
  if (!RAW) return;
  RAW._splitOverride = +e.target.value;
  const model = buildModel(RAW);
  start(model, true);
};
// 改表頭範圍會把資料列的數量整個換掉，列高與分頁不能沿用，所以重跑一次完整的 start
// 改列印範圍 = 重新框要排版的區域，資料列整組換掉，所以跑完整的 start
$('parea').onchange = e => {
  if (!RAW) return;
  const v = e.target.value.trim().toUpperCase().replace(/\$/g, '');
  if (!/^[A-Z]+\d+:[A-Z]+\d+$/.test(v)){ alert('格式要像 A1:T245'); e.target.value = D.area; return; }
  RAW._areaOverride = v;
  RAW._hdrOverride = null;   // 範圍換了，原本的表頭列號多半就不對了
  try { start(buildModel(RAW)); }
  catch (err){ alert('這個範圍排不出來：' + err.message); RAW._areaOverride = null; start(buildModel(RAW)); }
};
$('hdrLast').onchange = e => {
  if (!RAW) return;
  RAW._hdrOverride = Math.max(0, Math.floor(+e.target.value || 0));
  start(buildModel(RAW));
};

// 把一頁剩下的空白平均分給該頁每一列，讓行距看起來一致，不會上面擠、下面一大塊空白。
// 無條件捨去到 0.1pt，確保加完的總高不會反而超過容量、害最後一列被擠到下一頁。
// 哪些列是多行的：以自己的行高為單位，內容超過 1.5 行就算多行。
// 量的是目前畫面上的 DOM，所以要在改 S.h 之前呼叫。
function multiLineRows(){
  const out = new Set();
  document.querySelectorAll('tr[data-i]').forEach(tr => {
    const i = +tr.dataset.i;
    tr.querySelectorAll('.cw').forEach(w => {
      const lh = parseFloat(getComputedStyle(w).lineHeight);
      if (!lh) return;
      const keep = w.style.height; w.style.height = 'auto';
      const need = w.scrollHeight; w.style.height = keep;
      if (need > lh * 1.5) out.add(i);
    });
  });
  return out;
}

// 平均列高：單行列先壓回最小高度「固定」住，剩下的空白只分給會換行的多行列。
// 空白間隔列不動（那是原檔刻意留的距離），整頁都沒有多行列時退回平均分給每一列。
function evenOut(all){
  const pg = pages();
  const targets = all ? pg.map((idx,n) => [idx, n === pg.length-1])
                      : pg.map((idx,n) => [idx, n === pg.length-1]).filter(([idx]) => idx.includes(sel));
  if (!targets.length){ alert('先點選要調整的那一頁裡的任一列'); return; }
  const multi = multiLineRows();
  targets.forEach(([idx, last]) => {
    const one = S.oneLineH != null ? +S.oneLineH : 20;
    idx.forEach(i => {
      if (multi.has(i) || D.rows[i].blank) return;
      fit(i);                              // 先壓到最小，避免字被切掉
      S.h[i] = Math.max(S.h[i], one);      // 再統一拉到單行列高
    });
    const grow = idx.filter(i => multi.has(i));
    const pool = grow.length ? grow : idx;
    const add = (capOf(last) - idx.reduce((s,i) => s + rh(i), 0)) / pool.length;
    if (add > 0) pool.forEach(i => S.h[i] = Math.floor((S.h[i] + add) * 10) / 10);
  });
  render();
}

// 把調好的列高與分頁寫回 xlsx：只改工作表 XML 的 ht 和 rowBreaks，
// 其他（公式、樣式、欄寬、巨集、圖形）全部照抄，回 Excel 還能繼續微調。
async function exportXlsx(){
  if (!SRC){ alert('沒有原始檔可以寫回'); return; }
  const btn = $('bxlsx'), old = btn.textContent;
  btn.textContent = '產生中…'; btn.disabled = true;
  try {
    let txt = await entry(SRC.z, SRC.path);
    const hByRow = new Map(D.rowNums.map((rn,i) => [rn, rh(i)]));
    const gone = new Set(S.deletedRowNums || []);   // 刪掉的列改成隱藏，不動內容與公式
    txt = txt.replace(/<row\b[^>]*?\/?>/g, tag => {
      const m = /\sr="(\d+)"/.exec(tag);
      if (!m) return tag;
      const rn = +m[1];
      if (!hByRow.has(rn) && !gone.has(rn)) return tag;
      const selfClose = tag.endsWith('/>');
      let t = tag.slice(0, selfClose ? -2 : -1)
                 .replace(/\s(ht|customHeight|hidden)="[^"]*"/g, '');
      const attrs = gone.has(rn)
        ? ' hidden="true"'
        : ` ht="${hByRow.get(rn).toFixed(2)}" customHeight="true"`;
      return `${t}${attrs}${selfClose ? '/>' : '>'}`;
    });
    // 編輯過的內容寫回儲存格：像數字就存數字，否則存成 inline 字串（公式會被取代掉）
    const xesc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    Object.entries(S.edits).forEach(([key, text]) => {
      const r = cellOfKey(key);
      if (!r || !r.cell) return;
      const ref = colName(r.cell.col) + r.rowNum;
      const n = text.replace(/,/g, '').trim();
      const isNum = n !== '' && isFinite(n);
      const inner = isNum ? `<v>${n}</v>` : `<is><t xml:space="preserve">${xesc(text)}</t></is>`;
      txt = txt.replace(new RegExp(`<c r="${ref}"([^>]*)/>|<c r="${ref}"([^>]*)>[\\s\\S]*?</c>`), (m, a1, a2) => {
        let attrs = (a1 || a2 || '').replace(/\st="[^"]*"/, '');
        if (!isNum) attrs += ' t="inlineStr"';
        return `<c r="${ref}"${attrs}>${inner}</c>`;
      });
    });

    // 分頁：brk 的 id 是「這一列之後分頁」，所以寫每頁的最後一列
    const ids = pages().slice(0, -1).map(idx => D.rowNums[idx[idx.length-1]]);
    const xmlBrk = `<rowBreaks count="${ids.length}" manualBreakCount="${ids.length}">`
      + ids.map(id => `<brk id="${id}" man="true" max="16383" min="0"/>`).join('') + '</rowBreaks>';
    txt = /<rowBreaks[\s\S]*?<\/rowBreaks>|<rowBreaks[^>]*\/>/.test(txt)
      ? txt.replace(/<rowBreaks[\s\S]*?<\/rowBreaks>|<rowBreaks[^>]*\/>/, xmlBrk)
      : txt.replace(/<colBreaks|<\/worksheet>/, m => xmlBrk + m);

    const enc = new TextEncoder(), out = [];
    for (const name of Object.keys(SRC.z.files))
      out.push({name, bytes: name === SRC.path ? enc.encode(txt) : await entryBytes(SRC.z, name)});
    const a = el('a');
    a.href = URL.createObjectURL(await zipWrite(out));
    a.download = SRC.name.replace(/(\.[^.]+)$/, '') + '-已排版.xlsx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e){
    alert('匯出失敗：' + e.message); console.error(e);
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

function htmlLayout(){
  D.rows.forEach((_,i) => fit(i));   // 每列壓到左右頁文字實際需要的高度
  S.breaks = [];                     // 分頁交給高度決定，不沿用原檔的
  render();
}

// 末頁的表格總高含合計＋備註。跟著 sh 走時，備註底部就會落在其他頁地線的同一條線上，
// 末頁的地線（合計下框線）自動被備註的高度往上頂。
const endH = () => S.linkEnd ? S.sh : S.shend;
// S.h 只存「文字實際需要的高度」，列間距是排版時再加上去的，這樣間距可以隨時拉、
// 也不會被自動配高洗掉。內容靠上對齊，多出來的高度就成為和下一列之間的距離。
const rh = i => S.h[i] + S.gap;
// 減 2pt：分頁是照列高數字算的，實際渲染還會多出框線厚度，不留餘裕會有頁面剛好擠爆、
// 填空列被壓成 0，那一頁的地線就會比別頁低個 0.3mm；加 Math.max(10, ...) 避免負數引發死循環
// 合計／備註列的高度：使用者調過就用 S.footH，沒調過就沿用原檔
const footHt = k => (S.footH && S.footH[k] != null ? +S.footH[k] : D.foot[k].h);
const footTotal = () => D.foot.reduce((a, _, k) => a + footHt(k), 0);
const capOf = last => Math.max(10, (((last ? endH() : S.sh) * 72 / 25.4) - 2) / S.k - headPt - (S.headGap || 0) - (last ? footTotal() : 0));
const mmOf = h => h * S.k / 72 * 25.4;

// 線粗：沒設過就沿用原檔天線偵測出來的粗細
const linePt = () => S.borderPt != null ? +S.borderPt : (D.topBorderPt || .5);
const linePx = () => linePt() + 'pt solid #000';

// 整欄的左右框線覆寫。cellEl 和填空列都要用：填空列直接拿第一列的 class 建 td，
// 不一起覆寫的話，該欄的直線在頁面下半段的空白區還是會畫出來，看起來就像「關不掉」。
function colBorder(td, col){
  const cb = col != null && S.colBorders && S.colBorders[col];
  if (!cb) return;
  td.style.borderLeft  = cb === 'left'  || cb === 'both' ? linePx() : 'none';
  td.style.borderRight = cb === 'right' || cb === 'both' ? linePx() : 'none';
}

function cellEl(tag, c, h, i, side, ci){
  const td = el(tag, c.c);            // 框線在 td（border-collapse 合併），字的樣式在內層 div
  if (c.cs) td.colSpan = c.cs;
  if (c.rs) td.rowSpan = c.rs;
  const w = el('div', 'cw ' + c.c + (c.v ? ' ' + c.v : ''));
  if (h != null) w.style.height = (h * S.k).toFixed(2) + 'pt';

  // 對齊只有整欄一種，且只作用在資料列（i == null 是表頭／合計備註列，維持原檔樣子）
  const align = i != null && c.col != null && S.colAligns ? S.colAligns[c.col] : null;

  let t = c.t;
  if (align){
    if (align === 'distributed'){
      w.style.textAlign = 'center';
      const plain = (t || '').replace(/<[^>]*>/g, '');
      if (plain){
        t = plain.split('\n').map(line =>
          '<span class="dl">' + [...line].map(ch => '<i>' + ch + '</i>').join('') + '</span>').join('');
      }
    } else if (align === 'justify'){
      // ponytail: 原檔多半是 white-space:pre（不換行），不放寬就沒有第二行、justify 等於沒效果
      w.style.whiteSpace = 'pre-wrap';
      w.style.textAlign = 'justify';
    } else {
      w.style.textAlign = align;
    }
  }
  // 框線覆寫：列管上下、欄管左右，粗細跟天地線同一個值。
  // 寫在 td 的 inline style 上，才蓋得過 buildModel 產生的 class，也才會被 border-collapse 合併成連續線。
  const rb = i != null && S.rowBorders && S.rowBorders[i];
  if (rb){
    td.style.borderTop    = rb === 'top'  || rb === 'both' ? linePx() : 'none';
    td.style.borderBottom = rb === 'bottom' || rb === 'both' ? linePx() : 'none';
  }
  colBorder(td, c.col);

  // 「（一）計畫名稱……」換行後，第二行起自動對齊到右括號後面（凸排）。
  // 括號內容長度不定，用字寬估：全形算 1em、半形算 .5em。
  if (i != null){
    const pl = (t || '').replace(/<[^>]*>/g, '');
    const m = /^[\s　]*（[^）\n]{0,8}）/.exec(pl);
    if (m){
      const w0 = [...m[0]].reduce((s, ch) => s + (ch.charCodeAt(0) < 128 ? .5 : 1), 0);
      w.style.whiteSpace = 'pre-wrap';   // 不放寬就不會換行，凸排也就看不出來
      w.style.paddingLeft = `calc(3px + ${w0}em)`;
      w.style.textIndent = `-${w0}em`;
    }
  }

  w.innerHTML = t;
  td.appendChild(w);
  return td;
}

// 群組標題（自己沒有計畫內容、下一列比它更縮排）落在頁尾，內容卻在下一頁，看起來會斷掉。
// 原檔的空白間隔列留在頁尾也只是白佔位置。
const plainOf = t => (t || '').replace(/<[^>]*>/g, '').replace(/[\s\u3000]/g, '');
function badTail(i){
  const r = D.rows[i];
  if (r.blank) return true;
  const next = D.rows[i+1];
  return !!next && next.ind > r.ind && !plainOf(r.r[0] && r.r[0].t);
}

function paginate(guard){
  const hard = new Set(S.breaks), cap = capOf(false);
  const out = []; let cur = [], acc = 0;
  const close = auto => {
    let moved = [];
    if (auto && guard) while (cur.length > 1 && badTail(cur[cur.length-1])) moved.unshift(cur.pop());
    out.push(cur);
    cur = moved; acc = moved.reduce((s,i) => s + rh(i), 0);
  };
  D.rows.forEach((r,i) => {
    const h = rh(i);
    // 塞不下就一定要切，跟 S.push 無關：不切的話那一頁會溢出紙張，螢幕上跑到灰底、列印時被裁掉。
    // S.push 管的是「列可不可以前後流動＋頁尾守則」，不是「要不要防溢出」。
    if (cur.length && (hard.has(i) || acc + h > cap)) close(!hard.has(i));
    cur.push(i); acc += h;
  });
  if (cur.length) out.push(cur);
  // 末頁還要塞合計與備註，容量比別頁小（capOf(true) 已扣掉 footTotal()）。
  // 前面那輪是用一般頁的容量在算的，末頁一定要再修一次，否則備註會被擠到紙外、列印時不見。
  // 一樣跟 S.push 無關：這是防溢出，不是列的前後流動。
  for (let g = 0; g < 50 && out.length <= D.rows.length + 5; g++){
    const lp = out[out.length-1], cl = capOf(true), moved = [];
    while (lp.length > 1 && lp.reduce((s,i) => s + rh(i), 0) > cl) moved.unshift(lp.pop());
    if (!moved.length) break;
    out.push(moved);
  }
  return out.length ? out : [[]];
}

function pages(){
  const plain = paginate(false);
  if (!S.push) return plain;
  // 頁尾守則不強求：只有在不會多印一頁的時候才套用，會多一頁就維持原樣（改用標示提醒）
  const nice = paginate(true);
  return nice.length <= plain.length ? nice : plain;
}

function makePage(idx, side, no, last, first){
  const g = D.page, p = el('div','page');
  p.dataset.side = side;
  p.style.width = g.w + 'mm'; p.style.height = g.h + 'mm';
  p.style.padding = `${g.mt}mm ${g.mr}mm ${g.mb}mm ${g.ml}mm`;

  D.title.forEach(r => {
    const line = el('div','tline'); line.style.height = (r.h * S.k).toFixed(2) + 'pt';
    r[side].forEach(c => {
      const s = el('span', c.c);
      // 標題列每頁重複，（續）會出現在每一頁；第一組對開不該有
      let t = first ? c.t.replace(/（續）\s*$/, '') : c.t;
      if (side === 'r'){
        // 偶數頁（右頁）表名去除開頭的全形與半形空白，確保「畫」字完全靠左
        t = t.replace(/^[\s\u3000]+/, '');
      } else {
        // 奇數頁（左頁）表名去掉結尾空白，最後一個字才貼得到中縫。
        // 空白常被包在最後那個 <span> 裡，所以要允許後面還跟著收尾標籤。
        t = t.replace(/[\s\u3000]+(?=(?:<\/[^>]+>)*$)/, '');
      }
      const ta = S.titleAlign || 'seam';
      if (ta === 'center') s.style.textAlign = 'center';
      else if (ta === 'left') s.style.textAlign = 'left';
      else if (ta === 'right') s.style.textAlign = 'right';
      else {
        s.style.textAlign = side === 'r' ? 'left' : 'right';
      }
      s.innerHTML = t;
      line.appendChild(s);
    });
    p.appendChild(line);
  });

  const tb = el('table'), cg = el('colgroup');
  colWidths(side).forEach(w => { const co = el('col'); co.style.width = w + '%'; cg.appendChild(co); });
  tb.appendChild(cg);

  const head = el('thead');
  D.head.forEach((r,k) => {
    const tr = el('tr');
    r[side].forEach(c => {
      const span = c.rs || 1;
      tr.appendChild(cellEl('th', c, D.head.slice(k, k + span).reduce((s,x) => s + x.h, 0), null, side, null));
    });
    head.appendChild(tr);
  });
  tb.appendChild(head);

  const body = el('tbody');
  idx.forEach(i => {
    const tr = el('tr'); tr.dataset.i = i;
    if (i === sel) tr.className = 'sel';
    D.rows[i][side].forEach((c, ci) => {
      const key = i + '|' + side + '|' + ci;
      const edited = S.edits[key];
      const td = cellEl('td', edited != null ? Object.assign({}, c, {t: esc(edited)}) : c, rh(i), i, side, ci);
      const w = td.firstChild;
      w.dataset.key = key;
      // 每頁第一列跟表頭下邊線之間留一點空隙，字才不會貼著線。
      // 加在 td 的 padding 上（不動 S.h），這一頁的容量在 capOf 裡已經扣掉了。
      if (i === idx[0] && S.headGap) td.style.paddingTop = (S.headGap * S.k).toFixed(2) + 'pt';
      if (S.editing){ w.contentEditable = 'plaintext-only'; w.spellcheck = false; }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  const fill = el('tr');
  ((D.rows[idx[0]] || D.rows[0])[side]).forEach(c => {
    const t = el('td', c.c);
    if (!last) t.style.borderBottom = linePx();
    colBorder(t, c.col);
    fill.appendChild(t);
  });
  fill.style.height = '0';
  body.appendChild(fill);

  // 末頁的地線是合計列（foot 第一列）的下框線，粗細由原檔的 medium 決定，
  // 跟其他頁那條由 fill 列畫的地線是兩回事，所以要另外套「線粗」才會一致。
  // 合計與備註列：key 用 f<k> 開頭，跟資料列的數字索引分開，才不會撞在一起
  if (last) D.foot.forEach((r, k) => {
    const tr = el('tr'); tr.dataset.f = k;
    r[side].forEach((c, ci) => {
      const key = `f${k}|${side}|${ci}`;
      const edited = S.edits[key];
      const td = cellEl('td', edited != null ? Object.assign({}, c, {t: esc(edited)}) : c, footHt(k), null, side, null);
      const w = td.firstChild;
      w.dataset.key = key;
      // 合計／備註列：原檔的列高只當「最低高度」，格子自己隨內容長。
      // 這兩列的高度沒有 fit 可以重算，寫死高度＋overflow:hidden 就會把多出來的那行吃掉
      //（字還在，選得到也複製得到，就是看不見）。fitFoot 只負責把數字補回 S.footH，讓容量算得對。
      w.style.minHeight = w.style.height;
      w.style.height = 'auto';
      w.style.overflow = 'visible';
      if (S.editing){ w.contentEditable = 'plaintext-only'; w.spellcheck = false; }
      if (k === 0){
        td.style.borderBottom = linePx();
        // 合計列的列高是原檔給的，常常比字高很多。字若靠上，就會離地線（自己的下框線）很遠，
        // 所以這一列改成靠下對齊，字貼著地線走。
        const w = td.firstChild;
        w.classList.remove('vc');
        w.classList.add('vb');
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  tb.appendChild(body);
  p.appendChild(tb);
  const pn = el('div','pno'); pn.textContent = no; p.appendChild(pn);
  p._fill = fill; p._tb = tb;
  return p;
}

/* ---- 復原 / 重做 ----
   每次 render 前比對 S 有沒有變，變了就把「上一個 S」推進堆疊。這樣所有改設定的地方
   （對齊、框線、列高、分頁、滑桿…）都自動被記錄，不用在每個事件裡插 snapshot。
   ponytail: 只記 S。拖曳換列會動到 D.rows 的順序，那個復原不回來——要的話得把列序也搬進 S。 */
let undoStack = [], redoStack = [], lastSnap = null, restoring = false;
function snapshot(){
  const s = JSON.stringify(S);
  if (lastSnap === null){ lastSnap = s; return; }
  if (s === lastSnap) return;
  if (!restoring){
    undoStack.push(lastSnap);
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
  }
  lastSnap = s;
}
function applyState(json){
  restoring = true;
  S = JSON.parse(json);
  lastSnap = json;
  bind(); render();
  restoring = false;
  store.set(S);
  updateUndoBtns();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(S));
  applyState(undoStack.pop());
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(S));
  applyState(redoStack.pop());
}
function updateUndoBtns(){
  $('bundo').disabled = !undoStack.length;
  $('bredo').disabled = !redoStack.length;
}

let footFitting = false;
// 量合計／備註列真正需要的高度，比目前設定高就撐開
function fitFoot(){
  if (!D.foot.length) return false;
  let changed = false;
  D.foot.forEach((_, k) => {
    let px = 0;
    document.querySelectorAll(`tr[data-f="${k}"] .cw`).forEach(w => {
      px = Math.max(px, w.getBoundingClientRect().height / S.zoom);
    });
    const need = Math.max(4, Math.ceil(px / PT / S.k * 10) / 10);
    if (need > footHt(k) + 0.05){
      if (!S.footH) S.footH = D.foot.map(r => r.h);
      S.footH[k] = need;
      changed = true;
    }
  });
  return changed;
}

function render(){
  snapshot(); updateUndoBtns(); updateBtnStates();
  const doc = $('doc'); doc.innerHTML = '';
  const pg = pages();
  pg.forEach((idx,n) => {
    const sp = el('div','spread'), last = n === pg.length - 1;
    const L = makePage(idx,'l',n*2+1,last,n===0), R = makePage(idx,'r',n*2+2,last,n===0);
    sp.append(L,R); doc.appendChild(sp);
    const target = (last ? endH() : S.sh) * MM;
    // offsetHeight 是整數像素，會讓各頁地線差個 0.2mm；用 rect 的浮點高度（要除掉檢視縮放）
    const th = p => p._tb.getBoundingClientRect().height / S.zoom;
    const slack = Math.min(target - th(L), target - th(R));
    [L,R].forEach(p => p._fill.style.height = Math.max(0, slack) + 'px');
    // capOf(true) 已經扣掉合計＋附註，這裡只算資料列，不然會重複計
    const used = idx.reduce((s,i) => s + rh(i), 0), cap = capOf(last);
    [L,R].forEach(p => {
      const b = el('div','badge');
      b.textContent = `累積 ${mmOf(used).toFixed(1)} / ${mmOf(cap).toFixed(1)}mm`
        + (used > cap ? ` ・超出 ${mmOf(used-cap).toFixed(1)}mm` : ` ・剩 ${mmOf(cap-used).toFixed(1)}mm`);
      if (used > cap){ b.className = 'badge bad'; p.classList.add('over-cap'); }
      p.appendChild(b);
    });
    guides(sp, L, idx, last);
    if (S.breaks.includes(idx[0])){
      const m = el('div','mark');
      m.textContent = '⛔ 手動分頁（點掉讓資料往前流）';
      m.onclick = () => { S.breaks = S.breaks.filter(v => v !== idx[0]); render(); };
      L.appendChild(m);
    }
  });
  // 還是落單的群組標題：不強制搬動，標出來讓人自己決定
  pg.slice(0, -1).forEach(idx => {
    const t = idx[idx.length-1];
    if (!badTail(t)) return;
    document.querySelectorAll(`tr[data-i="${t}"]`).forEach(tr => {
      tr.classList.add('orphan');
      tr.title = '這一列是群組標題，內容在下一頁；要拉到下一頁就點它、按 B';
    });
  });
  document.querySelectorAll('.cw').forEach(w => {
    if (w.scrollHeight <= w.clientHeight + 1) return;
    // 比一行還矮的列是原檔刻意留的間隔列，不算被切掉
    if (w.clientHeight < parseFloat(getComputedStyle(w).lineHeight)) return;
    w.classList.add('over');
  });
  if (sel >= 0) $('rh').value = S.h[sel];
  // 合計／備註列若被原檔的列高切到字（有內容但看不見），自動撐高再畫一次。
  // 只長不縮，所以最多重畫一輪就收斂。
  if (!footFitting && fitFoot()){
    footFitting = true; restoring = true;
    render();
    restoring = false; footFitting = false;
    $('footH').value = footHt(+$('footSel').value || 0);
  }
  store.set(S);
}

// 左側標尺：每列標出本頁資料列到這裡的累積高度，點一下 = 在這一列之後停
function guides(sp, L, idx, last){
  const g = el('div','gut'), cap = capOf(last);
  let acc = 0;
  [...L.querySelectorAll('tr[data-i]')].forEach((tr,n) => {
    const i = +tr.dataset.i;
    acc += rh(i);
    if (tr.offsetHeight < 16 && n !== idx.length - 1) return;
    const lab = el('div','glab');
    lab.style.top = (tr.offsetTop + tr.offsetHeight) + 'px';
    lab.textContent = mmOf(acc).toFixed(0) + (n === idx.length - 1 ? ' ▏滿' : '');
    if (n === idx.length - 1) lab.classList.add('full');
    if (S.breaks.includes(i + 1)) lab.classList.add('brk');
    lab.title = `本頁資料列累積 ${mmOf(acc).toFixed(1)}mm / 可放 ${mmOf(cap).toFixed(1)}mm（剩 ${mmOf(cap-acc).toFixed(1)}mm，表頭已扣掉）`
              + `\n點一下 = ${S.breaks.includes(i+1) ? '取消在這裡停' : '就停在這一列'}`;
    lab.onclick = () => {
      const k = S.breaks.indexOf(i + 1);
      k < 0 ? S.breaks.push(i + 1) : S.breaks.splice(k, 1);
      S.breaks.sort((a,b) => a-b); render();
    };
    g.appendChild(lab);
  });
  sp.appendChild(g);
}

function setVar(){
  const r = document.documentElement.style;
  r.setProperty('--lh', S.lh); r.setProperty('--fs', S.fs); r.setProperty('--zoom', S.zoom); r.setProperty('--k', S.k);
  if (S.font) r.setProperty('--user-font', S.font);
  else r.removeProperty('--user-font');
  $('gapv').textContent = (+S.gap).toFixed(1) + 'pt';
  $('lhv').textContent = (+S.lh).toFixed(2);
  $('fsv').textContent = Math.round(S.fs*100) + '%';
  $('kv').textContent = Math.round(S.k*1000)/10 + '%';
  // 天線是第一列表頭的上框線，粗細寫在 buildModel 產生的 class 裡，只能用 !important 蓋掉
  $('lineCss').textContent = S.borderPt != null
    ? `thead tr:first-child th{border-top:${+S.borderPt}pt solid #000!important}` : '';
}
function applyH(i){
  document.querySelectorAll(`tr[data-i="${i}"] .cw`).forEach(w => w.style.height = (rh(i)*S.k).toFixed(2) + 'pt');
}
function select(i){
  sel = i;
  document.querySelectorAll('tr.sel').forEach(t => t.classList.remove('sel'));
  document.querySelectorAll(`tr[data-i="${i}"]`).forEach(t => t.classList.add('sel'));
  $('rh').disabled = i < 0; $('rh').value = i < 0 ? '' : S.h[i];
  updateBtnStates();
}

// 對齊／框線按鈕的亮起狀態：列那組看選取列，欄那組看下拉選到的欄。
// 沒設過就全部不亮（＝沿用原檔），跟「無線」是不同狀態。
const BTN_STATE = [
  ['brb_',    {top:'t', bottom:'b', both:'both', none:'n'},                     () => sel >= 0 && (S.rowBorders || {})[sel]],
  ['bcol_',   {left:'l', center:'c', right:'r', distributed:'d', justify:'j'}, () => (S.colAligns || {})[+$('colAlignSelect').value]],
  ['bcb_',    {left:'l', right:'r', both:'both', none:'n'},                     () => (S.colBorders || {})[+$('colAlignSelect').value]]
];
function updateBtnStates(){
  if (!S) return;
  BTN_STATE.forEach(([prefix, map, get]) => {
    const on = get();
    Object.entries(map).forEach(([v, k]) => {
      const b = $(prefix + k);
      if (b) b.classList.toggle('active', on === v);
    });
  });
}
$('rh').onchange = e => { if (sel < 0) return; S.h[sel] = Math.max(4, +e.target.value); applyH(sel); render(); };

function fit(i){
  let px = 0;
  document.querySelectorAll(`tr[data-i="${i}"] .cw`).forEach(w => {
    const h = w.style.height; w.style.height = 'auto';
    px = Math.max(px, w.scrollHeight); w.style.height = h;
  });
  S.h[i] = Math.max(4, Math.ceil(px / PT / S.k * 10) / 10);
}

let drag = null, colDrag = null, rowDrag = null;
const doc = $('doc');

// ---- 資料列換順序 ----
function moveRow(from, to, pos){
  if (from == null || to == null) return;
  let target = pos === 'after' ? to + 1 : to;
  if (from < target) target--;
  if (from === target) return;

  const [row] = D.rows.splice(from, 1);
  D.rows.splice(target, 0, row);

  const [rn] = D.rowNums.splice(from, 1);
  D.rowNums.splice(target, 0, rn);

  const [h] = S.h.splice(from, 1);
  S.h.splice(target, 0, h);

  if (dflt && dflt.h){
    const [dh] = dflt.h.splice(from, 1);
    dflt.h.splice(target, 0, dh);
  }

  const newEdits = {};
  Object.entries(S.edits).forEach(([k, v]) => {
    const parts = k.split('|');
    if (parts[0][0] === 'f'){ newEdits[k] = v; return; }   // 合計／備註列不跟著資料列搬
    let cur = +parts[0];
    if (cur === from){
      cur = target;
    } else if (from < target && cur > from && cur <= target){
      cur--;
    } else if (from > target && cur >= target && cur < from){
      cur++;
    }
    newEdits[cur + '|' + parts[1] + '|' + parts[2]] = v;
  });
  S.edits = newEdits;

  // 列被搬動後，掛在列索引上的框線設定要跟著搬
  if (S.rowBorders){
    const out = {};
    Object.entries(S.rowBorders).forEach(([k, v]) => {
      let cur = +k;
      if (cur === from) cur = target;
      else if (from < target && cur > from && cur <= target) cur--;
      else if (from > target && cur >= target && cur < from) cur++;
      out[cur] = v;
    });
    S.rowBorders = out;
  }

  // 跨頁移動時同步更新手動分頁點，使分頁邊界維持並讓列順利跨頁
  if (S.breaks && S.breaks.length){
    S.breaks = S.breaks.map(b => {
      if (from < target){
        if (b > from && b <= target) return b - 1;
      } else if (from > target){
        if (b >= target && b <= from) return b + 1;
      }
      return b;
    }).filter(b => b > 0 && b < D.rows.length);
    S.breaks = [...new Set(S.breaks)].sort((a,b) => a-b);
  }

  if (sel === from) sel = target;
  else if (from < target && sel > from && sel <= target) sel--;
  else if (from > target && sel >= target && sel < from) sel++;

  render();
  select(sel);
}

// ---- 刪除資料列 ----
// 刪掉的列號記在 S.deletedRowNums，匯出 xlsx 時把原檔那幾列設成隱藏
// （不真的刪列，公式與參照才不會整份跑掉）。
// ponytail: 跟拖曳換列一樣動到 D.rows，⌘Z 復原不回來，所以按鈕要先問一次。
function deleteRow(i){
  if (i < 0 || i >= D.rows.length || D.rows.length <= 1) return;

  D.rows.splice(i, 1);
  const [rn] = D.rowNums.splice(i, 1);
  S.h.splice(i, 1);
  if (dflt && dflt.h) dflt.h.splice(i, 1);

  // 索引大於被刪那列的往前補一格；等於的直接丟掉
  const shift = o => {
    if (!o) return o;
    const out = {};
    Object.entries(o).forEach(([k, v]) => { const c = +k; if (c !== i) out[c > i ? c - 1 : c] = v; });
    return out;
  };
  S.rowBorders = shift(S.rowBorders);

  const newEdits = {};
  Object.entries(S.edits).forEach(([k, v]) => {
    const [ri, side, ci] = k.split('|');
    if (ri[0] === 'f'){ newEdits[k] = v; return; }   // 合計／備註列不受資料列刪除影響
    if (+ri === i) return;
    newEdits[`${+ri > i ? +ri - 1 : +ri}|${side}|${ci}`] = v;
  });
  S.edits = newEdits;

  // 分頁點落在被刪那列時不丟掉：後面那列遞補到同一個索引，分頁邊界就保住了
  S.breaks = [...new Set((S.breaks || []).map(b => b > i ? b - 1 : b))]
    .filter(b => b > 0 && b < D.rows.length).sort((a,b) => a-b);

  (S.deletedRowNums = S.deletedRowNums || []).push(rn);

  render();
  select(Math.min(i, D.rows.length - 1));
  store.set(S);
}
$('bdel').onclick = () => {
  if (sel < 0){ alert('請先點選要刪除的資料列'); return; }
  if (confirm(`刪除第 ${sel + 1} 列？（復原鍵救不回來）`)) deleteRow(sel);
};

// ---- 欄寬拖曳 ----
function colWidths(side){
  return (S.colWidths && S.colWidths[side]) || D.cols[side];
}
function findColEdge(e){
  const page = e.target.closest('.page');
  if (!page || !page._tb) return null;
  const thead = page._tb.querySelector('thead');
  if (!thead) return null;
  const r = thead.getBoundingClientRect();
  if (e.clientY < r.top || e.clientY > r.bottom) return null;
  const side = page.dataset.side;
  const widths = colWidths(side);
  const tr = page._tb.getBoundingClientRect();
  let cumX = tr.left;
  for (let i = 0; i < widths.length - 1; i++){
    cumX += widths[i] / 100 * tr.width;
    if (Math.abs(e.clientX - cumX) < 4 * S.zoom)
      return {side, col: i, tableW: tr.width};
  }
  return null;
}

doc.addEventListener('pointermove', e => {
  if (colDrag){
    const dp = (e.clientX - colDrag.startX) / colDrag.tableW * 100;
    const nw = colDrag.origWidths.slice();
    const a = colDrag.origWidths[colDrag.col] + dp;
    const b = colDrag.origWidths[colDrag.col + 1] - dp;
    if (a < 1 || b < 1) return;
    nw[colDrag.col] = a; nw[colDrag.col + 1] = b;
    if (!S.colWidths) S.colWidths = {};
    S.colWidths[colDrag.side] = nw;
    document.querySelectorAll(`.page[data-side="${colDrag.side}"] table colgroup`).forEach(cg => {
      [...cg.children].forEach((c, i) => { c.style.width = nw[i] + '%'; });
    });
    return;
  }
  if (drag){
    S.h[drag.i] = Math.max(4, Math.round((drag.h0 + (e.clientY - drag.y) / S.zoom / PT / S.k) * 10) / 10);
    applyH(drag.i); return;
  }
  if (rowDrag){
    if (!rowDrag.active){
      if (Math.hypot(e.clientX - rowDrag.startX, e.clientY - rowDrag.startY) > 6){
        rowDrag.active = true;
        document.body.classList.add('row-dragging');
        document.querySelectorAll(`tr[data-i="${rowDrag.startI}"]`).forEach(tr => tr.classList.add('dragging'));
      }
    }
    if (rowDrag.active){
      document.querySelectorAll('tr.drag-target-before, tr.drag-target-after').forEach(t => {
        t.classList.remove('drag-target-before', 'drag-target-after');
      });
      const target = findDropTarget(e);
      if (target){
        rowDrag.targetI = target.targetI;
        rowDrag.pos = target.pos;
        document.querySelectorAll(`tr[data-i="${target.targetI}"]`).forEach(t => {
          t.classList.add(target.pos === 'before' ? 'drag-target-before' : 'drag-target-after');
        });
      } else {
        rowDrag.targetI = null;
      }
      return;
    }
  }
  const ce = findColEdge(e);
  if (ce){ doc.style.cursor = 'col-resize'; return; }
  const tr = e.target.closest('tr[data-i]');
  doc.style.cursor = tr && (tr.getBoundingClientRect().bottom - e.clientY) < 5 * S.zoom ? 'row-resize' : '';
});

// 跨頁拖曳目標偵測：即使拖到目標頁的表頭或頁尾填空區，也能精確識別
function findDropTarget(e){
  const elements = document.elementsFromPoint(e.clientX, e.clientY);
  for (const el of elements){
    const tr = el.closest && el.closest('tr[data-i]');
    if (tr){
      const targetI = +tr.dataset.i;
      const rect = tr.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < (rect.height / 2) ? 'before' : 'after';
      return { targetI, pos };
    }
  }
  for (const el of elements){
    const page = el.closest && el.closest('.page');
    if (page){
      const trs = [...page.querySelectorAll('tr[data-i]')];
      if (trs.length){
        const firstR = trs[0].getBoundingClientRect();
        if (e.clientY < firstR.bottom){
          return { targetI: +trs[0].dataset.i, pos: 'before' };
        } else {
          return { targetI: +trs[trs.length-1].dataset.i, pos: 'after' };
        }
      }
    }
  }
  return null;
}
doc.addEventListener('pointerdown', e => {
  const ce = findColEdge(e);
  if (ce){
    colDrag = {side: ce.side, col: ce.col, startX: e.clientX,
              origWidths: colWidths(ce.side).slice(), tableW: ce.tableW};
    e.preventDefault(); doc.setPointerCapture(e.pointerId);
    return;
  }
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  const i = +tr.dataset.i; select(i);
  if ((tr.getBoundingClientRect().bottom - e.clientY) < 5 * S.zoom){
    drag = {i, y: e.clientY, h0: S.h[i]};
    e.preventDefault(); doc.setPointerCapture(e.pointerId);
  } else if (!S.editing){
    rowDrag = {startI: i, startX: e.clientX, startY: e.clientY, active: false, targetI: null, pos: null};
    doc.setPointerCapture(e.pointerId);
  }
});
doc.addEventListener('pointerup', () => {
  if (colDrag){ colDrag = null; render(); return; }
  if (drag){ drag = null; render(); return; }
  if (rowDrag){
    document.body.classList.remove('row-dragging');
    document.querySelectorAll('tr.dragging, tr.drag-target-before, tr.drag-target-after').forEach(t => {
      t.classList.remove('dragging', 'drag-target-before', 'drag-target-after');
    });
    if (rowDrag.active && rowDrag.targetI != null){
      moveRow(rowDrag.startI, rowDrag.targetI, rowDrag.pos);
    }
    rowDrag = null;
  }
});
doc.addEventListener('dblclick', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  fit(+tr.dataset.i); render();
});
document.addEventListener('keydown', e => {
  if (!D) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !S.editing){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if (e.target.tagName === 'INPUT' || sel < 0) return;
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    const target = e.key === 'ArrowUp' ? sel - 1 : sel + 1;
    if (target >= 0 && target < D.rows.length){
      moveRow(sel, target, e.key === 'ArrowUp' ? 'before' : 'after');
    }
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    S.h[sel] = Math.max(4, S.h[sel] + (e.key === 'ArrowUp' ? -1 : 1) * (e.shiftKey ? 5 : 1));
    applyH(sel); e.preventDefault();
    clearTimeout(window._t); window._t = setTimeout(render, 250);
  }
  if (e.key.toLowerCase() === 'b') toggleBreak();
});
function toggleBreak(){
  if (sel <= 0) return;
  const k = S.breaks.indexOf(sel);
  k < 0 ? S.breaks.push(sel) : S.breaks.splice(k,1);
  S.breaks.sort((a,b) => a-b); render();
}

$('bbrk').onclick = toggleBreak;
$('bfit').onclick = () => { if (sel >= 0){ fit(sel); render(); } };
$('bfitall').onclick = () => { D.rows.forEach((_,i) => fit(i)); render(); };
$('bfitpage').onclick = () => {
  const pg = pages().find(idx => idx.includes(sel));
  if (!pg){ alert('先點選要調整的那一頁裡的任一列'); return; }
  pg.forEach(i => fit(i)); render();
};
$('bauto').onclick = () => {
  if (confirm('清掉全部 ' + S.breaks.length + ' 個手動分頁點，改成完全照列高流動？')){
    S.breaks = [];
    S.push = true;              // 按鈕講的就是「照列高自動流動」，順手把開關打開，不然會一個分頁點都不剩
    $('push').checked = true;
    render();
  }
};
$('push').onchange = e => { S.push = e.target.checked; render(); };
// --- 直接改資料 ---
$('edit').onchange = e => {
  S.editing = e.target.checked;
  document.body.classList.toggle('editing', S.editing);
  render();
};
// 改完（離開該格）才存檔重排，才不會邊打字邊跳掉游標
// 編輯 key 有兩種：資料列是 "3|l|0"，合計／備註列是 "f0|l|0"。
// 這支把 key 解回「是哪一格、對應原檔第幾列」，commitEdit 與匯出都用它。
function cellOfKey(key){
  const [ri, side, ci] = key.split('|');
  if (ri[0] === 'f'){
    const k = +ri.slice(1), row = D.foot[k];
    return row && {cell: row[side][+ci], rowNum: D.footNums[k], foot: true};
  }
  const row = D.rows[+ri];
  return row && {cell: row[side][+ci], rowNum: D.rowNums[+ri], i: +ri, foot: false};
}

function commitEdit(w){
  if (!w || !w.dataset.key) return false;
  const key = w.dataset.key, txt = w.innerText.replace(/\u00a0/g, ' ').replace(/\n$/, '');
  const ref = cellOfKey(key);
  if (!ref || !ref.cell) return false;
  const 原文 = (ref.cell.t || '').replace(/<[^>]*>/g, '')
                 .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  const 變了 = txt !== (S.edits[key] != null ? S.edits[key] : 原文);
  if (txt === 原文) delete S.edits[key]; else S.edits[key] = txt;
  // 合計／備註列的高度不歸 S.h 管，沒有 fit 可以重算
  if (變了){ if (!ref.foot) fit(ref.i); render(); }
  return 變了;
}
doc.addEventListener('focusout', e => {
  const w = e.target.closest && e.target.closest('.cw[contenteditable]');
  if (w) commitEdit(w);
});
doc.addEventListener('keydown', e => {
  if (!S.editing) return;
  const w = e.target.closest && e.target.closest('.cw[contenteditable]');
  if (!w) return;
  if (e.key === 'Escape'){ w.blur(); }
  e.stopPropagation();               // 編輯時 ↑↓ 和 B 不要被當成調列高／分頁
});
// 編輯中不要觸發拖曳改列高／選取列
doc.addEventListener('pointerdown', e => { if (S.editing) e.stopPropagation(); }, true);

function resetToDefault(){
  if (!RAW) return;
  delete RAW._splitOverride;
  if (KEY) localStorage.removeItem(KEY);
  const model = buildModel(RAW);
  D = model;
  titlePt = D.title.reduce((s,r) => s + r.h, 0);
  headPt  = D.head.reduce((s,r) => s + r.h, 0);
  const shDflt = +((D.page.h - D.page.mt - D.page.mb) - titlePt * D.k / 72 * 25.4).toFixed(1);
  dflt = {h: D.rows.map(r => r.h), breaks: D.breaks.slice(),
          lh: 1.15, fs: 1, zoom: .5, k: D.k, push: false, sh: shDflt, shend: shDflt, linkEnd: true, gap: 0, edits: {},
          colWidths: null, viewMode: 'fitH',
          colAligns: {}, titleAlign: 'seam', rowBorders: {}, colBorders: {},
          borderPt: D.topBorderPt || .5, headGap: 3, footH: D.foot.map(r => r.h), oneLineH: 20};
  S = JSON.parse(JSON.stringify(dflt));
  sel = -1;
  populateSplitSelect();
  bind();
  render();
}

$('bxlsx').onclick = exportXlsx;
$('bhtml').onclick = htmlLayout;
$('beven').onclick = () => evenOut(false);
$('bevenall').onclick = () => evenOut(true);
$('breset').onclick = () => { if (confirm('回到 Excel 原始列高與分頁？')){ resetToDefault(); } };
$('bsave').onclick = () => {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
  a.download = D.name + '.layout.json'; a.click();
};
$('bload').onclick = () => {
  const f = el('input'); f.type = 'file'; f.accept = '.json';
  f.onchange = () => f.files[0].text().then(t => { S = Object.assign({}, dflt, JSON.parse(t)); bind(); render(); });
  f.click();
};
$('bprint').onclick = () => window.print();
$('bundo').onclick = undo;
$('bredo').onclick = redo;

function bind(){
  $('lh').value = S.lh; $('fs').value = S.fs; $('sh').value = S.sh; $('gap').value = S.gap;
  $('zm').value = S.zoom; $('k').value = S.k;
  $('push').checked = S.push;
  $('edit').checked = !!S.editing;
  document.body.classList.toggle('editing', !!S.editing);
  $('linkend').checked = S.linkEnd;
  $('shend').disabled = S.linkEnd;
  $('shend').value = endH();
  if (!S.viewMode) S.viewMode = 'fitH';
  $('fontFam').value = S.font || '';
  $('titleAlign').value = S.titleAlign || 'seam';
  $('bpt').value = linePt();
  $('hgap').value = S.headGap || 0;
  $('oneh').value = S.oneLineH != null ? S.oneLineH : 20;
  $('hdrLast').value = D.hdrLast;
  $('parea').value = D.area;
  populateFootSelect();
  populateColAlignSelect();
  setVar();
  applyViewMode(); updateViewBtn();
}
const redraw = () => { clearTimeout(window._r); window._r = setTimeout(render, 150); };
$('k').oninput  = e => { S.k = +e.target.value; setVar(); redraw(); };
$('gap').oninput = e => { S.gap = +e.target.value; setVar(); redraw(); };
$('lh').oninput = e => { S.lh = +e.target.value; setVar(); redraw(); };
$('fs').oninput = e => { S.fs = +e.target.value; setVar(); redraw(); };
$('sh').onchange = e => { S.sh = +e.target.value; bind(); render(); };
$('shend').onchange = e => { S.shend = +e.target.value; render(); };
$('linkend').onchange = e => { S.linkEnd = e.target.checked; bind(); render(); };
$('zm').oninput = e => { S.zoom = +e.target.value; S.viewMode = 'manual'; setVar(); updateViewBtn(); };

// ---- Fit Height / Fit Width 切換 ----
function calcFitZoom(mode){
  if (!D) return .5;
  const pw = D.page.w, ph = D.page.h;
  const vpW = window.innerWidth, vpH = window.innerHeight - ($('bar').offsetHeight || 40);
  // spread 是兩頁並排 + 12px gap + 58px 左側標尺 + 40px padding
  const spreadW = pw * 2 * (96/25.4) + 12 + 58 + 40;
  const pageH = ph * (96/25.4) + 40;
  if (mode === 'fitW') return Math.min(1.5, vpW / spreadW);
  return Math.min(1.5, vpH / pageH);
}
function applyViewMode(){
  const mode = S.viewMode || 'fitH';
  const d = $('doc');
  if (mode === 'manual'){
    d.classList.remove('fit-center');
    return;
  }
  S.zoom = calcFitZoom(mode);
  d.classList.add('fit-center');
  $('zm').value = S.zoom;
  setVar();
}
function updateViewBtn(){
  const b = $('bview');
  const mode = S.viewMode || 'fitH';
  b.textContent = mode === 'fitH' ? '滿高' : mode === 'fitW' ? '滿寬' : '自訂';
  b.classList.toggle('active', mode !== 'manual');
}
$('bview').onclick = () => {
  const m = S.viewMode || 'fitH';
  S.viewMode = m === 'fitH' ? 'fitW' : m === 'fitW' ? 'manual' : 'fitH';
  applyViewMode(); updateViewBtn(); store.set(S);
};
window.addEventListener('resize', () => {
  if ((S.viewMode || 'fitH') !== 'manual') applyViewMode();
});
</script>
